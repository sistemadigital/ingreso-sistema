<script id="d" type="text/plain">
1|Ámbito de aplicación|En todo el territorio de la Provincia de Misiones, excluido el fuero federal, los honorarios de los abogados y procuradores, por su labor, en juicio o fuera de él, se determinan con arreglo a la presente Ley.
2|Orden público e irrenunciabilidad|Las normas de esta Ley son de orden público.
La renuncia anticipada de honorarios o el convenio por un monto inferior al que corresponda por esta Ley se tienen por no escritos, salvo lo dispuesto en el artículo siguiente. Los pagos recibidos según convenios de ese tipo valen como pagos a cuenta del monto que corresponda por esta Ley.
Los Artículos 1 y 2 de la Ley I - N.º 86 (Antes Ley 2919) no son aplicables a la determinación de los honorarios profesionales en tanto se opongan a lo establecido en la presente Ley.
Los Artículos 730 último párrafo y 1255 segundo párrafo del Código Civil y Comercial de la Nación, como la Ley Nacional N.° 24.432, son aplicables en la medida en que no se opongan a las normas de la presente Ley.
3|Renuncia de honorarios|El profesional puede renunciar total o parcialmente a honorarios en los siguientes casos:
1) cuando el patrocinado o representado sea el cónyuge, conviviente, ascendiente, descendiente, hermano o quien recibe trato familiar ostensible;
2) cuando el patrocinado o representado actúe con beneficio de litigar sin gastos.
4|Profesionales en relación con el Estado|Los abogados y procuradores que se desempeñan con o sin relación de dependencia y que perciben en forma habitual sueldo u otra clase de remuneración, en cualquiera de los Poderes del Estado Provincial, Organismos de la Constitución, Municipalidades y/o sus Entes Autárquicos, Descentralizados, Empresas del Estado, Sociedades del Estado y Sociedades Anónimas con Capital Estatal Mayoritario no perciben honorario alguno de sus mandantes. Pueden, no obstante, percibir honorarios de terceros, cuando media condena en costas a cargo de éstos.
5|Honorarios superiores a la ley|Los profesionales pueden fijar un monto de honorarios con relación a cada asunto, superior al establecido en esta Ley, el que debe ser redactado por escrito y en doble ejemplar bajo pena de nulidad. En caso de resolución por incumplimiento de la labor profesional encomendada, el profesional pierde el derecho a los mayores honorarios pactado. Si la resolución se produce por culpa del cliente, los mantiene en forma proporcional al trabajo realizado.
6|Estipulaciones según el tiempo|Es nula toda estipulación sobre honorarios que fija su monto exclusivamente en relación al tiempo de duración del asunto.
7|Actuación en causa propia|Los abogados y procuradores que intervienen en causa propia tienen derecho a percibir sus honorarios de la parte contraria si es condenada en costas. Si el profesional que se presenta por derecho propio es patrocinado por otro profesional, se le regulan honorarios como procurador. Si él mismo ejerce su propio patrocinio letrado, se le regulan honorarios en el doble carácter de abogado y procurador.
8|Honorario del procurador|El honorario del procurador en su tarea específica se le regula entre el treinta y cinco por ciento (35%) y el cincuenta por ciento (50%) del correspondiente al abogado.
9|Abogado que ejerce representación|Cuando el abogado ejerza la representación de su patrocinado, percibe también el honorario correspondiente al procurador.
10|Mantenimiento del patrocinio|A los efectos de la regulación de honorarios, la firma del abogado patrocinante en los escritos, implica el mantenimiento de su dirección profesional en los escritos posteriores que no la llevan, mientras no sea sustituido en el patrocinio por otro abogado que suscribe las presentaciones.
11|Pluralidad de profesionales|A los fines del honorario profesional el desempeño de más de un abogado o procurador, por una misma parte y en el mismo carácter en forma conjunta o sucesivamente, es considerado como actuación única. Pero las regulaciones son individuales.
12|Litisconsorcio|En caso de litisconsorcio activo o pasivo, en los que intervienen diferentes profesionales en atención de las partes los honorarios de cada uno de ellos se regulan de acuerdo al interés de cada litisconsorte, atendiendo además, a la actuación cumplida por cada profesional y a los principios generales contenidos en el Artículo 13.
13|Pautas generales de regulación|Para fijar el monto de honorario se tiene en cuenta principalmente, sin perjuicio de las peculiaridades de cada caso o juicio, los siguientes elementos:
1) valor pecuniario del asunto o proceso, cuando lo tenga;
2) índole o complejidad del asunto o proceso;
3) el resultado obtenido;
4) el mérito de la labor profesional, su calidad, utilidad, duración y la responsabilidad inherente a la misma.
14|Escala de primera instancia|En todo proceso, cualquiera sea su clase, en el que se demandan o transmiten sumas de dinero o bienes susceptibles de apreciación pecuniaria, los honorarios del abogado por la actuación de primera instancia, se fijan en una suma de dinero equivalente a un porcentaje determinado entre el diecinueve por ciento (19%) como mínimo y el veinticinco por ciento (25%) como máximo del monto del proceso determinado de conformidad con los Artículos 19, 20 y 21.
En ningún caso los honorarios profesionales pueden ser inferiores al mínimo de la escala que antecede.
Para los procesos de ejecución rige la escala del Artículo 23.
Ninguna actuación judicial puede tener una regulación inferior al treinta por ciento (30%) para los abogados y al quince por ciento (15%) para los procuradores del salario mínimo, vital y móvil vigente al tiempo de practicarse la regulación.
15|Segunda o ulterior instancia|Los honorarios por actuaciones en segunda o ulterior instancia, incluidas las relacionadas con recursos de hecho o de queja, son fijados en consonancia con los principios generales establecidos en los artículos precedentes y guardando, en lo posible, una adecuada relación con los montos regulados en la instancia o instancias anteriores; en ningún caso pueden ser inferiores al treinta por ciento (30%) del establecido en primera instancia.
16|Parte perdidosa|El honorario de los profesionales de la parte perdidosa del juicio totalmente, se fija tomando como mínimo el setenta por ciento (70%) del mínimo de la escala del Artículo 14 y como máximo el cien por ciento (100%) del mínimo de dicha escala. Si en el juicio se acumulan acciones o se deduce reconvención, se regula el honorario teniendo en cuenta el resultado de cada acción.
17|Administrador judicial|Si el profesional actúa como administrador judicial en proceso voluntario, contencioso o universal, se aplica como mínimo el treinta por ciento (30%) de la escala del Artículo 14 y como máximo el cincuenta por ciento (50%) de la misma, sobre el valor del caudal administrado por año de administración, en concepto de honorarios.
18|Procesos penales, correccionales y de faltas|En los procesos criminales, correccionales, de faltas o contravenciones, se aplican las mismas normas de los artículos precedentes.
19|Monto del proceso|Se considera como monto del proceso a los fines de la aplicación de la escala del Artículo 14 el que resulta de los siguientes valores:
1) si la acción versa sobre sumas de dinero, el monto es el capital y accesorios reclamados, salvo que la sentencia establezca una suma mayor, en cuyo caso se está a esta última;
2) si la acción versa sobre bienes inmuebles el monto es, siempre que no concurra la determinación fijada en el Artículo 20, el valor que las partes asignan a los inmuebles objeto del juicio, el de la tasación judicial o la valuación fiscal. En caso de que concurran dos o más de estos montos, se toma el mayor de ellos. Pero en todos los casos se debe contemplar la devaluación monetaria desde el momento de la determinación hasta el de la regulación. Se incluyen dentro de esta previsión los procesos sobre acciones posesorias o reales incluidos los de usucapión, escrituración, simulación o nulidad de actos jurídicos referidos a inmuebles, interdictos, mensura y deslinde;
3) si la acción versa sobre bienes muebles, el monto es el valor que las partes le asignan en el proceso, las cotizaciones o tablas oficiales o el valor de tasación aprobado judicialmente, tomándose el mayor valor si concurren varios de los expresados. Son de aplicación las disposiciones del inciso anterior en cuanto sean compatibles con la naturaleza de los bienes en litigio;
4) si la acción versa sobre hechos o tiende a la declaración o reconocimiento de derechos susceptibles de apreciación pecuniaria, se atiende al valor que resulta del proceso o de la coincidente estimación de las partes o de aquél que se obtiene del informe de entidades idóneas o profesionales. Si concurren varios valores se debe tomar el mayor de ellos;
5) si la acción es de desalojo el monto es el veinticinco por ciento (25%) del valor real del inmueble vigente al tiempo de la regulación y determinado de conformidad al Artículo 20 y en su defecto al inciso 2) del presente. Se aplica esta regla aún en los casos en que la causal invocada es la de falta de pago;
6) si la acción es de consignación, se toma como base el valor de lo consignado. Si es de alquileres se toma el equivalente a dos (2) años de locación; igual período se considera en los juicios de reajustes de alquileres;
7) en los juicios de alimentos, el monto del proceso es el equivalente a dos (2) años de la cuota que se fija en la sentencia;
8) en los procesos de concursos y quiebras se aplican las disposiciones sobre aranceles establecidas en las leyes sobre la materia;
9) en los juicios sucesorios testamentarios o ab-intestato el monto está constituido por el valor total de los bienes que se transmiten, adicionándole el cincuenta por ciento (50%) de los gananciales que corresponden al cónyuge supérstite si lo hubiere, determinados en la forma prescripta en los incisos 1), 2) y 3). Deben computarse los bienes existentes en otras jurisdicciones, excepción hecha de la tarea que corresponde a la inscripción en el registro pertinente;
10) en los juicios de divorcio el monto a considerarse es el cincuenta por ciento (50%) del valor de los bienes que integran el convenio regulador previsto en los Artículos 438, 439 y concordantes del Código Civil y Comercial de la Nación, determinado en la forma prescripta en el Artículo 20;
11) en los incidentes y tercerías se regulan los honorarios profesionales en forma separada del juicio principal, tomándose en consideración el monto reclamado en éste y la vinculación mediata o inmediata que pueden tener en la solución definitiva de la causa. En los incidentes los honorarios se regulan del diez por ciento (10%) al veinte por ciento (20%) de la escala del Artículo 14 y en las tercerías del cincuenta por ciento (50%) al ochenta por ciento (80%) de la misma escala;
12) en la acción de división de bienes comunes, disolución y liquidación de sociedades, el monto debe ser el que resulta de la aplicación de los incisos 2) y 3) sobre los bienes que componen la masa a distribuirse si existe controversia; si no la hubiere, se atenderá a la cuota parte patrocinada o representada por cada profesional;
13) si la acción es de expropiación, directa o indirecta, el monto del juicio está dado por la indemnización total que se fija en la sentencia, incluidos los intereses. En caso de retrocesión se debe tomar el valor del inmueble al tiempo en que recaiga el pronunciamiento;
14) en la acción autónoma de nulidad de sentencia, la base arancelaria debe ser el monto del proceso que dio lugar a la acción;
15) en la medida autosatisfactiva o en la tutela judicial anticipada, la base arancelaria debe ser el monto de la sentencia o el valor real de los bienes objeto de la sentencia;
16) en los casos de procesos que no están comprendidos en los incisos anteriores u otros artículos de esta Ley, debe aplicarse la escala del Artículo 14 sobre el valor real de los bienes o sumas de dinero y accesorios objeto del juicio.
20|Determinación del valor real de los bienes|En todos los casos, se hallen o no enunciados en el artículo anterior, los profesionales intervinientes, pueden solicitar la determinación del valor real actualizado de los bienes objeto del juicio o relacionados con el mismo, a los fines arancelarios, mediante el siguiente procedimiento:
El profesional interesado debe efectuar una estimación fundada del valor del o de los bienes. De la misma se corre traslado a las partes del juicio por el término de tres (3) días, bajo apercibimiento de considerar el silencio como conformidad. El traslado se debe notificar personalmente o por cédula en el domicilio procesal constituido; si media oposición o el profesional renuncia a la estimación se designa de oficio perito tasador, dentro del término de cinco (5) días de formulada la oposición o de efectuada la solicitud del profesional.
El perito tasador debe expedirse dentro del término que fija la resolución de designación. De la tasación pericial se corre traslado a las partes por el término de cinco (5) días notificándose personalmente o por cédula.
Los gastos que demanda la pericia son soportados por los obligados en costas, salvo los casos de estimaciones excesivas de los profesionales interesados en que por auto fundado, pueden ser condenados al pago total o parcial de dichos gastos.
El procedimiento previsto no requiere reserva previa, pero debe solicitarse antes de la regulación judicial de los honorarios.
21|Juicios por cobro de dinero|En los juicios por cobro de dinero, la cuantía del asunto que motiva el pleito resulta, a los fines de la regulación de honorarios, de la liquidación que se practica del capital, intereses y desvalorización monetaria hasta el momento del pago.
La desvalorización monetaria es determinada por medio del informe que al efecto se requiere a la Instituto Provincial de Estadística y Censos (IPEC).
Mensualmente la repartición indicada, remite al Superior Tribunal de Justicia de la Provincia un informe sobre la desvalorización monetaria a los fines que sean remitidos a los distintos Juzgados para los reajustes que correspondan.
22|Etapas procesales|A efecto de la regulación de honorarios, los procesos según su naturaleza, se consideran divididos en etapas las que se toman en cuenta para apreciar la extensión e intensidad de la labor profesional y que se determina como sigue:
1) Proceso Ordinario: lo integran tres (3) etapas: la demanda, la reconvención y sus respectivas contestaciones, constituyen la primera etapa; las actuaciones sobre la prueba forman la otra etapa; el alegato o cualquier otra actuación hasta la sentencia constituye la tercera etapa del juicio;
2) Procesos Sumarísimos y Laborales: están integradas por dos (2) etapas: la demanda, su contestación y trámites hasta la apertura a prueba o declaración de puro derecho, firmes o consentidas, constituyen la primera etapa del juicio; las actuaciones sobre producción de las pruebas y demás diligencias hasta la sentencia constituyen la otra etapa;
3) Procesos de Ejecución: se los considera divididos en tres (3) etapas: el escrito inicial y actuaciones hasta la citación de venta o intimación de pago inclusive integran la primera etapa. Las actuaciones posteriores hasta la sentencia integran otra etapa. Las diligencias para cumplimiento o ejecución de la sentencia de remate constituyen la tercera y última etapa;
4) Procesos Especiales: los interdictos, procesos por incapacidad, inhabilitación, rehabilitación, sobre alimentos, rendición de cuenta, mensura y deslinde, expropiación directa y demás procesos especiales que no tramitan por el procedimiento ordinario, se consideran divididos en dos etapas. El escrito inicial y su responde si lo hubiere constituyen la mitad del juicio y las actuaciones posteriores la otra etapa;
5) Procesos Universales de Concursos y Quiebras: se los considera divididos en tres (3) etapas: el escrito inicial de presentación constituye una de ellas; las actuaciones posteriores hasta la verificación de créditos forman la segunda etapa; las actuaciones posteriores hasta la terminación del proceso, integran la tercera etapa. Las actuaciones correspondientes al pedido de concurso o quiebra formulado por un acreedor equivale a la tercera parte del proceso;
6) Juicio Sucesorio: se lo considera dividido en tres (3) etapas de igual importancia: el escrito de apertura y los trámites siguientes hasta obtener la declaratoria de herederos o la aprobación del testamento, constituyen la primera etapa; las actuaciones correspondientes a las operaciones de inventarios y avalúo o equivalentes y demás diligencias tendientes a la determinación de los bienes y su valor, conforman la segunda etapa; las actuaciones realizadas con motivo de la liquidación y pagos de los gravámenes que afectan el acervo hereditario hasta la inscripción en los registros respectivos, constituyen la tercera y última etapa;
7) Proceso Arbitral: se integra por las etapas correspondientes al procedimiento ordinario o sumarísimo que se dispuso seguir;
8) Incidentes y Tercerías: los incidentes que se suscitan en los juicios, ya sea que tramiten en el proceso o separadamente se divide en las mismas etapas del proceso sumarísimo. Las tercerías se ajustan a la de los procesos ordinarios o incidentes, según la tramitación que corresponde seguir;
9) Otras Actuaciones Judiciales: tratándose de actuaciones producidas en jurisdicción penal y en general de aquellas no previstas especialmente, corresponde adaptar las etapas y regulaciones consiguientes a las reglas establecidas precedentemente.
23|Procesos de ejecución|En los procesos de ejecución se aplica la escala del Artículo 14 reducida en un veinticinco por ciento (25%). En caso de que se opongan excepciones se prescinde de la reducción indicada.
24|Albaceas|Los honorarios de los profesionales que actúan como albaceas o lo patrocinan, se fijan de acuerdo a las reglas precedentes respecto de trabajos que importan la iniciación o prosecución del juicio; si su actuación se limita a lograr el cumplimiento de las medidas dispuestas en el testamento, los honorarios son fijados atendiendo a su valor económico y a la extensión de la tarea cumplida.
25|Abogados partidores|Los honorarios de los abogados partidores se fijan entre el dos por ciento (2%) y el tres por ciento (3%) del valor del caudal a dividirse.
26|Medidas cautelares|En los procesos de embargo preventivo, secuestro, intervención y administración de bienes, prohibición de innovar o contratar y demás medidas cautelares que tramitan por separado y sus levantamientos, los honorarios son los que resultan de aplicar la escala del Artículo 14 con una reducción del cincuenta por ciento (50 %). En los procesos de protección de personas y otras medidas cautelares que no tienen monto determinado o determinable, se aplican las pautas fijadas en el Artículo 13 a los efectos de la regulación de los honorarios respetándose los honorarios mínimos establecidos en esta Ley.
27|Proceso arbitral|Proceso Arbitral. Los honorarios por el patrocinio o representación se ajustan a la escala y atendiendo a la naturaleza del proceso. La actuación del abogado como árbitro o arbitrador motiva también la aplicación de la escala del Artículo 14. Si se desempeña como secretario, se aplica el cuarenta por ciento (40%) de la misma.
28|Habeas corpus, habeas data, amparo y extradición|En los procesos sobre habeas corpus, habeas data, amparo y extradición, en que los honorarios no pueden establecerse por aplicación de la escala del Artículo 14, se debe atender a lo dispuesto por el Artículo 13 y los honorarios del abogado no pueden ser inferiores al valor de tres (3) salarios mínimos, vitales y móviles.
29|Honorario en época de feria|El desempeño profesional en tiempo de feria judicial o administrativa, dentro o fuera del proceso, se remunera acrecentándose el monto que corresponde a honorarios fuera de feria entre el veinticinco por ciento (25%) y el cincuenta por ciento (50%) según el tiempo invertido en la tarea.
30|Regulación judicial a falta de acuerdo|No habiendo acuerdo entre el profesional y su cliente, los honorarios se regulan judicialmente aplicando las normas establecidas en la presente Ley y el procedimiento del juicio sumarísimo regulado en la Ley XII - N.° 27 - Código Procesal Civil, Comercial, de Familia y Violencia Familiar.
31|Cuestiones extrajudiciales o administrativas|Tratándose de cuestiones extrajudiciales o administrativas, como regla general se observan dentro de lo posible los porcentuales, carácter del asunto, complejidad de las tareas, resultados obtenidos, tiempo de duración, gastos y trabajos materiales realizados por los profesionales, tendiendo a una justa retribución.
32|Pacto de cuota litis|Los abogados y procuradores matriculados, pueden pactar con el cliente conjunta o separadamente, que la remuneración profesional por su actuación, en uno o más procesos o asuntos, consista en participar de sus resultados, debiendo en estos casos cumplirse con los requisitos que seguidamente se especifican bajo pena de nulidad:
1) debe ser instrumentado por escrito y en doble ejemplar antes de comenzar o durante la actuación profesional;
2) los honorarios del abogado y del procurador no puede exceder en conjunto del cincuenta por ciento (50%) del resultado en dinero o en valores económicos del proceso o asunto, incluidos los accesorios. Esta regla se aplica también cuando el cliente celebra más de un pacto con los mismos o distintos profesionales;
3) el convenio comporta la obligación de los profesionales de responder directamente, en su caso, por las costas causídicas del adversario;
4) los profesionales deben adelantar a su cargo los gastos necesarios del juicio;
5) los honorarios que se declaran exclusivamente a cargo de la parte contraria, corresponden en forma exclusiva a los profesionales firmantes,
6) no pueden ser objeto del pacto de cuota litis los juicios que versan sobre alimentos. El pacto de cuota litis en materia laboral no puede exceder del veinte por ciento (20%) del monto de los créditos reconocidos en la causa.
33|Resolución del pacto|El cliente puede prescindir del profesional en los siguientes casos y condiciones:
1) abonando o entregando al profesional el máximo a lo que a éste le hubiere correspondido en el supuesto de obtener éxito total en la reclamación objeto del pacto.
2) cuando media dolo, culpa o negligencia del profesional, debidamente acreditada.
34|Regulación al dictarse sentencia|Al dictarse sentencia en todos los casos y fueros, sin necesidad de petición alguna, se deben regular los honorarios que corresponden a los abogados y procuradores de ambas partes.
35|Regulación a pedido y regulaciones parciales|Los profesionales pueden solicitar la regulación de sus honorarios y obtenerlas, al cesar su actuación.
También pueden requerirse regulaciones parciales, durante la sustanciación del proceso, siempre que transcurra más de un (1) año sin que se practique regulación alguna en la misma causa.
36|Recurso de reposición y apelación|Todo acto que regula honorarios puede ser objeto de recurso de reposición por ante el mismo Juez que lo dicta por parte interesada, que puede ser interpuesto ante el actuario en el mismo acto de notificación personal o dentro de los cinco (5) días de ocurrida la notificación personal o por cédula. El escrito que interpone el recurso puede fundarse o limitarse a la mera interposición.
La resolución que recaiga debe ser fundada siempre que no se haga lugar al recurso y debe ser dictada en todos los casos dentro de los cinco (5) días subsiguientes a la interposición del recurso. Dicha resolución causa ejecutoria a menos que el recurso de reposición sea acompañado del de apelación en subsidio.
Dentro de los cinco (5) días siguientes a la notificación deben ser elevados los autos. Si la resolución impugnada es motivo de agravios y también los honorarios, la Alzada, al pronunciarse se expide en capítulo especial y con expresa fundamentación, sobre el monto de los mismos. Cuando sólo los honorarios son objeto del recurso, la Alzada debe expedirse en forma fundada dentro de los quince (15) días de recepcionados los autos sin ninguna sustanciación.
37|Intereses|Los honorarios devengan un interés tipo tasa activa para descuento de documentos comerciales a treinta (30) días del banco que actúa como agente financiero de la Provincia, capitalizables mensualmente conforme los incisos c) y d) del Artículo 770 del Código Civil y Comercial de la Nación.
38|Acción de cobro|El honorario establecido judicialmente da acción contra la parte condenada en costas y/o contra el cliente, a opción del profesional por la vía de ejecución de sentencia. Si el cliente abona los honorarios no habiendo sido condenado en costas, tiene el derecho de repetir el importe abonado, sus gastos e intereses a la parte realmente obligada al pago.
Las notificaciones y demás diligencias judiciales pueden ser practicadas válidamente, en el domicilio legal constituido por el ejecutado en el juicio principal que origina los honorarios, siempre que dicho domicilio no sea constituido por el ejecutante.
39|Firma de abogado obligatoria|Los magistrados judiciales y autoridades administrativas, incluidas las fiscales, no deben dar curso a demanda, contestación, reconvención, alegato, memorial, expresión de agravios y sus respuestas, ofrecimiento de prueba, interposición y sustanciación de recursos, que no lleven firmas de abogados.
La iniciación de todo tipo de actuación ante órganos del Poder Judicial, requiere patrocinio letrado, y su ausencia determina las mismas consecuencias que las previstas en el párrafo anterior.
40|Conformidad para dar por terminado el proceso|Los tribunales, no pueden antes de los dos (2) años de la última intervención profesional, dar por terminado el proceso o asunto, disponer su archivo, aprobar o mandar cumplir la transacción hacer efectivo el desistimiento, dar por cumplida la sentencia o resolución, ordenar la entrega, adjudicación o transferencia de sumas de dinero y otros bienes, disponer desglose de documentación o el levantamiento de medidas precautorias, sin la conformidad expresa y por escrito de los profesionales que intervinieron, cuando no existe constancia de haber sido desinteresados respecto de sus honorarios o garantizados con bienes suficientes. En el caso de no dar los profesionales su conformidad expresa con el monto y la garantía ofrecida, el Tribunal o autoridad competente lo establece.
41|Gastos, movilidad y apertura de carpeta|Además de los honorarios, los abogados y procuradores tienen derecho al reintegro de los gastos especiales y de movilidad en que incurren en su gestión profesional.
El Superior Tribunal de Justicia debe fijar y actualizar los gastos de movilidad en la unidad pesos por kilómetros.
Tanto la fijación como la actualización se realizan a pedido del Colegio de Abogados, y en base al estudio que al efecto presente esta institución, debiendo considerarse en la misma todos los factores concurrentes a la determinación.
Asimismo tienen derecho a percibir en concepto de apertura de carpeta y gastos administrativos por tareas preparatorias del inicio de causas judiciales, una suma equivalente al veinte por ciento (20%) del salario mínimo, vital y móvil.
42|Honorarios mínimos por labores extrajudiciales|Los honorarios de los profesionales por su labor extrajudicial no pueden ser inferiores a los siguientes valores según el caso:
1) por consultas personales, telefónicas, o por cualquier medio de comunicación informático o equivalente, el diez por ciento (10%) del salario mínimo, vital y móvil;
2) por consultas acompañadas de informe escrito, en papel o soporte informático o equivalente, el veinte por ciento (20%) del salario mínimo, vital y móvil;
3) por redacción de cartas documento, telegramas de intimaciones, o intimaciones efectuadas por medios escritos, informáticos o equivalente, el diez por ciento (10%) del salario mínimo, vital y móvil;
4) por informes de actuaciones y expedientes judiciales o administrativos, el veinte por ciento (20%) del salario mínimo, vital y móvil;
5) por asistencia y asesoramiento en la suscripción de actos jurídicos, el treinta por ciento (30%) del salario mínimo, vital y móvil;
6) por redacción de contratos de locación o compraventa, del uno por ciento (1%) al cinco por ciento (5%) del valor del contrato, debiéndose respetar en todos los casos un mínimo del treinta por ciento (30%) del salario mínimo, vital y móvil;
7) por redacción de otros contratos, de tres décimas por ciento (0,3%) al cinco por ciento (5%) del valor de los mismos, debiéndose respetar en todos los casos un mínimo del treinta por ciento (30%) del salario mínimo, vital y móvil;
8) por redacción de contratos o estatutos de sociedades comerciales, asociaciones o sociedades civiles, fundaciones, mutuales o cooperativas, el veinte por ciento (20%) de la escala del Artículo 14 aplicable sobre el capital de la entidad, debiéndose respetar en todos los casos un mínimo de un (1) salario mínimo, vital y móvil;
9) por redacción de denuncias penales, sin firma letrada, el treinta por ciento (30%) del salario mínimo, vital y móvil;
10) por asistencia a audiencias de mediación o conciliación, sin base arancelaria, el veinte por ciento (20%) del salario mínimo, vital y móvil;
11) por redacción de minutas de testamentos o testamentos, el dos por ciento (2%) de la escala del Artículo 14 aplicable sobre el valor de los bienes dispuestos, debiéndose respetar en todos los casos un mínimo del treinta por ciento (30%) del salario mínimo, vital y móvil;
12) por trámites administrativos ante autoridades de aplicación, un (1) salario mínimo, vital y móvil.
43|Divorcio y nulidad del matrimonio|En los procesos de divorcio o nulidad del matrimonio, los honorarios no pueden ser inferiores a tres (3) salarios mínimos, vitales y móviles.
En ningún caso, el cálculo que resulta de la aplicación del inciso 10) del Artículo 19, puede afectar los honorarios mínimos previstos en el párrafo precedente.
44|Guarda y guarda con fines de adopción|En los procesos de guarda y guarda con fines de adopción, los honorarios no pueden ser inferiores a tres (3) salarios mínimos, vitales y móviles.
45|Adopción y nulidad de adopción|En los procesos de adopción plena, simple o de integración, como los procesos de nulidad de adopción, previstos en los Artículos 619 y 634 del Código Civil y Comercial de la Nación, los honorarios no pueden ser inferiores a tres (3) salarios mínimos, vitales y móviles.
46|Tutela y curatela|En las acciones de tutela o curatela y cese de las mismas, establecidas en los Artículos 104 a 140 del Código Civil y Comercial de la Nación, los honorarios no pueden ser inferiores a cuatro (4) salarios mínimos, vitales y móviles.
47|Restricción de la capacidad e inhabilitación|En las acciones de restricción de la capacidad o inhabilitación, establecidas en los Artículos 31 a 50 del Código Civil y Comercial de la Nación, los honorarios no pueden ser inferiores a seis (6) salarios mínimos vitales y móviles.
48|Acciones de filiación|En las acciones de filiación establecidas en los Artículos 576 a 593 del Código Civil y Comercial de la Nación, los honorarios no pueden ser inferiores a seis (6) salarios mínimos vitales y móviles.
49|Responsabilidad parental, cuidado personal y comunicación|En las acciones referidas a responsabilidad parental, guarda o cuidado personal, régimen de comunicación y contacto, los honorarios no pueden ser inferiores a cuatro (4) salarios mínimos, vitales y móviles.
50|Violencia familiar|En las acciones referidas a violencia familiar, exclusión de hogar, veedurías, prohibición de acercamiento y demás medidas cautelares del proceso de violencia de familia, los honorarios no pueden ser inferiores a tres (3) salarios mínimos, vitales y móviles.
51|Información sumaria|En las acciones de información sumaria, los honorarios no pueden ser inferiores a medio (1/2) salario mínimo, vital y móvil.
52|Trámites administrativos o registrales|En la tramitación judicial de cuestiones administrativas o ante el registro público previsto en el Artículo 323 del Código Civil y Comercial de la Nación, los honorarios no pueden ser inferiores a un (1) salario mínimo, vital y móvil.
53|Denuncias penales y excarcelación|Por denuncias penales con firma del letrado, incidentes de excarcelación o exención de prisión, los honorarios no pueden ser inferiores a dos (2) salarios mínimos, vitales y móviles.
54|Suspensión de juicio a prueba|En los pedidos de suspensión de juicio a prueba, los honorarios no pueden ser inferiores a tres (3) salarios mínimos, vitales y móviles.
55|Juicio penal abreviado|En la suscripción de acta o participación de juicio penal abreviado, los honorarios no pueden ser inferiores a dos (2) salarios mínimos, vitales y móviles.
56|Proceso penal hasta la clausura de la instrucción|Por la actuación profesional en un proceso penal hasta la etapa de clausura de la instrucción, los honorarios no pueden ser inferiores a cuatro (4) salarios mínimos, vitales y móviles.
57|Proceso penal desde la clausura de la instrucción|Por la actuación profesional en un proceso penal desde la clausura de la instrucción hasta la sentencia, los honorarios no pueden ser inferiores a cuatro (4) salarios mínimos, vitales y móviles.
58|Acciones colectivas|En las acciones colectivas que se promueven en virtud de los Artículos 43 de la Constitución Nacional o 52 de la Ley Nacional N.º 24.240, los honorarios no pueden ser inferiores a siete (7) salarios mínimos, vitales y móviles.
59|Acciones declarativas e inconstitucionalidad|En las acciones meramente declarativas o acciones de inconstitucionalidad, los honorarios no pueden ser inferiores a siete (7) salarios mínimos, vitales y móviles.
60|Actos de discriminación|En las acciones contra actos de discriminación, los honorarios no pueden ser inferiores a cinco (5) salarios mínimos, vitales y móviles.
61|Acciones colectivas ambientales|En las acciones colectivas de protección del ambiente, los honorarios no pueden ser inferiores a ocho (8) salarios mínimos, vitales y móviles.
62|Prevención del daño|En las acciones de prevención del daño previstas en el Artículo 1711 del Código Civil y Comercial de la Nación, los honorarios no pueden ser inferiores a siete (7) salarios mínimos, vitales y móviles.
63|Cesación de publicidad ilícita|En la acción de cesación de publicidad ilícita prevista en el Artículo 1102 del Código Civil y Comercial de la Nación, los honorarios no pueden ser inferiores a cuatro (4) salarios mínimos, vitales y móviles.
64|Defensa del consumidor (vía administrativa)|En los procesos administrativos de defensa del consumidor, donde el consumidor o el denunciado es patrocinado o representado por un abogado, los honorarios se establecen conforme a la escala del Artículo 14, y los supuestos donde no existe base arancelaria, los honorarios no pueden ser inferiores a un (1) salario mínimo, vital y móvil.
65|Acción autónoma de nulidad de sentencia|En la acción autónoma de nulidad de sentencia, los honorarios no pueden ser inferiores a seis (6) salarios mínimos, vitales y móviles.
66|Medida autosatisfactiva|En la medida autosatisfactiva los honorarios no pueden ser inferiores a tres (3) salarios mínimos, vitales y móviles.
67|Pronto despacho judicial|En la petición de pronto despacho judicial prevista en el Artículo 44 de la Ley I – N.º 89 (Antes Ley 2970) y en ordenanzas municipales, los honorarios no pueden ser inferiores a un (1) salario mínimo, vital y móvil.
68|Acceso a la información pública|En la acción judicial de acceso a la información pública prevista en el Artículo 16 de la Ley IV – N.º 58 y en ordenanzas municipales, los honorarios no pueden ser inferiores a un (1) un salario mínimo, vital y móvil.
69|Tutela anticipada, protección de personas y cautelares|En los procesos de tutela judicial anticipada, protección de personas y en las medidas cautelares, los honorarios no pueden ser inferiores a tres (3) salarios mínimos, vitales y móviles.
70|Cédulas de la Ley Nacional N.º 22.172|Por la tramitación de cédulas Ley Nacional N.° 22.172 provenientes de otras jurisdicciones, que se diligencian dentro del perímetro o radio fijado para la realización de diligencias sin provisión de movilidad, los honorarios de los profesionales no pueden ser inferiores al quince por ciento (15%) de un (1) salario mínimo, vital y móvil.
Cuando las mismas se diligencian fuera de dicho perímetro o radio, los honorarios de los profesionales no pueden ser inferiores al treinta por ciento (30%) de un (1) salario mínimo, vital y móvil.
71|Exhortos y oficios de la Ley Nacional N.º 22.172|En la tramitación de exhortos u oficios Ley Nacional N.° 22.172, provenientes de otras jurisdicciones, los honorarios de los profesionales no pueden ser inferiores a la mitad de un (1) salario mínimo, vital y móvil.
72|Cláusula de forma|Comuníquese al Poder Ejecutivo.
</script>

const $=s=>document.querySelector(s),main=$('#main'),side=$('#side');
const PAL=[['#5b50c4','#eeecfb'],['#2c74b3','#e6f1fb'],['#237f64','#e3f5ee'],['#b8602a','#fdefe4'],['#b0436b','#fce9f0'],['#85701f','#f6f1df']];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const link=s=>s.replace(/\b(Art[íi]culos?\s+(?:N\.º\s*)?)(\d{1,2})\b/g,(m,p,n)=>+n>=1&&+n<=72?`${p}<a class="x" href="#/a/${n}">${n}</a>`:m);
/* Parseo de artículos */
const A=[],byN={};
document.getElementById('d').textContent.trim().split(/\n(?=\d{1,2}\|)/).forEach(b=>{const[n,t,...r]=b.split('|');const p=r.join('|').split('\n');const a={n:+n,t,p,s:p[0].replace(/:$/,'').split(/(?<=\.)\s/)[0].slice(0,230)+(p[0].length>230?'…':'')};a.k=norm(t+' '+p.join(' '));A.push(a);byN[a.n]=a});
/* Nodos */
const N=[];S.forEach((s,si)=>{const r={i:N.length,lv:1,si,kind:'Sección',num:s[0],name:s[1],par:-1,arts:[],ch:[]};N.push(r);s[2].forEach(c=>{const n={i:N.length,lv:2,si,kind:c[0],num:'',name:c[1],par:r.i,arts:[],ch:[],from:c[2],to:c[3]};for(let x=c[2];x<=c[3];x++)n.arts.push(x);r.ch.push(n.i);N.push(n)})});
const nodeOf={};N.forEach(n=>n.arts.forEach(x=>nodeOf[x]=n.i));
const secs=N.filter(n=>n.lv==1),root=i=>N[i].par<0?i:N[i].par;
const sub=i=>{const n=N[i];return n.lv==2?n.arts:n.ch.flatMap(sub)};
const col=i=>PAL[N[i].si%PAL.length][0],bg=i=>PAL[N[i].si%PAL.length][1];
const label=n=>n.lv==1?'Sección '+n.num:n.kind;
const title=n=>n.name;
const rng=i=>{const s=sub(i);return s.length?(s[0]==s[s.length-1]?'Art. '+s[0]:`Arts. ${s[0]}–${s[s.length-1]}`):''};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)};
function nav(){let h='<h5>Índice</h5>';secs.forEach(l=>{h+=`<details><summary style="border-left:4px solid ${col(l.i)}">Sección ${l.num} · ${esc(l.name)}</summary>`;l.ch.forEach(c=>h+=`<a class="l" data-n="${c}" href="#/n/${c}">${esc(N[c].kind)} · ${esc(N[c].name)}</a>`);h+='</details>'});side.innerHTML=h}
function artHTML(a){const body=a.p.map(p=>`<p class="${/^\d+\)\s/.test(p)?'inc':''}">${link(esc(p))}</p>`).join('');
return `<article class="art" id="a${a.n}"><header><div class="num">Art. ${a.n}</div><div><h4>${esc(a.t)}</h4><p class="sum">${link(esc(a.s))}</p></div></header><div class="acts"><button class="btn sm" data-act="t">Ver texto completo</button><button class="btn sm ghost" data-act="c" data-n="${a.n}">Copiar</button><button class="btn sm ghost" data-act="l" data-n="${a.n}">Enlace</button></div><div class="full" hidden>${body}</div></article>`}
const crumbs=i=>{let c=[],k=i;while(k>=0){c.unshift(`<a href="#/n/${k}">${esc(label(N[k]))}</a>`);k=N[k].par}return `<nav class="crumb"><a href="#/">Inicio</a><span>›</span>${c.join('<span>›</span>')}</nav>`};
function card(i){const n=N[i],s=sub(i);const txt=n.ch.length?n.ch.slice(0,4).map(c=>N[c].name).join(' · '):s.slice(0,4).map(x=>byN[x].t).join(' · ')+(s.length>4?' · …':'');
return `<a class="card" href="#/n/${i}" style="--ac:${col(i)};--b:${bg(i)}"><h3><span class="big">${esc(label(n))}</span>${esc(n.name)}</h3><p>${esc(txt)}</p><div class="meta"><span>${rng(i)}</span><span>${s.length} art.</span>${n.ch.length?`<span>${n.ch.length} ${n.ch.length>1?'divisiones':'división'}</span>`:''}</div></a>`}
const foot=()=>`<p class="foot">Texto de la Ley XII – N.º 4 (antes Ley 607) de la Provincia de Misiones según el documento cargado. Los títulos y síntesis de cada artículo son una guía de lectura generada a partir del texto; verifique siempre con la versión oficial vigente antes de su uso profesional. Los valores en salarios mínimos, vitales y móviles (SMVM) deben calcularse con el monto vigente al momento de la regulación.</p>`;
function home(){main.style.cssText='';
main.innerHTML=`<section class="hero"><span class="eyebrow">Provincia de Misiones</span><h1>Honorarios de Abogados y Procuradores</h1><p>Texto completo de la Ley XII – N.º 4 (antes Ley 607), con índice navegable, síntesis de cada artículo, búsqueda, referencias cruzadas y tabla de honorarios mínimos.</p>
<div class="stats"><div class="stat"><b>${A.length}</b><span>artículos</span></div><div class="stat"><b>${secs.length}</b><span>secciones</span></div><div class="stat"><b>${N.filter(n=>n.lv==2).length}</b><span>títulos y capítulos</span></div></div>
<div class="go"><input id="gn" type="number" min="1" max="72" placeholder="Ir al artículo N.º"><button class="btn" id="gb">Ir</button><a class="btn" href="#/minimos">💲 Honorarios mínimos</a></div></section>
<div class="sec"><h2>Secciones</h2><span>Acceso rápido a cada sección de la Ley</span></div><div class="grid">${secs.map(l=>card(l.i)).join('')}</div>
<div class="sec"><h2>Accesos rápidos</h2><span>títulos y capítulos</span></div><div class="grid">${N.filter(n=>n.lv==2).map(n=>card(n.i)).join('')}</div>${foot()}`;
const go=()=>{const v=+$('#gn').value;if(v>=1&&v<=72)location.hash='/a/'+v;else toast('Ingrese un número entre 1 y 72')};$('#gb').onclick=go;$('#gn').onkeydown=e=>e.key=='Enter'&&go()}
function nodeView(i){const n=N[i],s=sub(i),ac=col(i);let h=crumbs(i)+`<header class="nh"><span class="eyebrow">${n.lv==2?esc(label(N[n.par]))+' · ':''}${esc(label(n))}</span><h1>${esc(n.name)}</h1><div class="meta"><span>${rng(i)}</span><span>${s.length} artículo${s.length>1?'s':''}</span></div></header>`;
let sm=`<div class="box"><h4>Resumen de la sección</h4><p>Comprende ${s.length>1?`los artículos <b>${s[0]}</b> a <b>${s[s.length-1]}</b> (${s.length} en total)`:`el artículo <b>${s[0]}</b>`}${n.ch.length?`, organizados en ${n.ch.length} ${n.ch.length>1?'divisiones':'división'}:`:', que regulan:'}</p><ul>`;
sm+=n.ch.length?n.ch.map(c=>`<li><a href="#/n/${c}"><b>${esc(N[c].kind)}</b> – ${esc(N[c].name)}</a> <small>(${rng(c)})</small></li>`).join(''):n.arts.map(x=>`<li><a href="#/a/${x}"><b>Art. ${x}</b> – ${esc(byN[x].t)}</a></li>`).join('');
h+=sm+'</ul></div>';
if(n.ch.length)h+=`<div class="grid">${n.ch.map(card).join('')}</div>`;
if(n.arts.length)h+=`<div class="bar"><button class="btn sm" data-act="all">Expandir todos los textos</button><button class="btn sm ghost" data-act="none">Contraer todos</button></div>`+n.arts.map(x=>artHTML(byN[x])).join('');
const u=N.filter(m=>m.arts.length),k=u.indexOf(n);if(k>=0)h+=`<div class="pn">${k>0?`<a class="btn ghost" href="#/n/${u[k-1].i}">← ${esc(title(u[k-1]))}</a>`:'<span></span>'}${k<u.length-1?`<a class="btn ghost" href="#/n/${u[k+1].i}">${esc(title(u[k+1]))} →</a>`:''}</div>`;
main.innerHTML=h+foot();main.style.cssText=`--ac:${ac};--b:${bg(i)}`;
side.querySelectorAll('.l').forEach(l=>l.classList.toggle('on',+l.dataset.n==i));const l=side.querySelector(`.l[data-n="${n.lv==2?i:''}"]`);if(l)l.parentElement.open=true}
/* Búsqueda */
const STOP=new Set('de del la las el los lo al a y e o u en con por para que se su sus es son ser un una como si no mas sobre entre hay ha este esta cuando donde'.split(' '));
const stem=w=>w.length<5?w:w.replace(/(aciones|acion|mente|ados|adas|ado|ada|es|s)$/,'');
const NUMW={1:'uno un una',2:'dos',3:'tres',4:'cuatro',5:'cinco',6:'seis',7:'siete',8:'ocho',10:'diez',15:'quince',20:'veinte',30:'treinta'};
const SYN=['plazo termino','honorario arancel retribucion','minimo piso','apelacion recurso reposicion','cuota litis pacto','divorcio matrimonio','alimentos cuota','feria inhabil','cobro ejecucion interes','sentencia regulacion','penal criminal'].map(g=>g.split(' '));
function accepted(t){const set=new Set([stem(t)]);SYN.forEach(g=>{if(g.map(stem).includes(stem(t)))g.forEach(x=>set.add(stem(x)))});if(/^\d+$/.test(t)&&NUMW[+t])NUMW[+t].split(' ').forEach(w=>set.add(w));for(const[n,ws]of Object.entries(NUMW))if(ws.split(' ').includes(t))set.add(n);return[...set]}
const hasAcc=(k,acc)=>acc.some(x=>k.includes(x));
function hl(t,accs){return esc(t).replace(/[A-Za-zÁÉÍÓÚÜáéíóúüÑñ0-9]+/g,w=>{const s=norm(w);return accs.some(a=>a.some(x=>x.length>=3&&s.includes(x)))?`<mark>${w}</mark>`:w})}
let lib='';const setLib=v=>{lib=v;document.querySelectorAll('#fc .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.l===v))};
function search(v){const terms=[...new Set((norm(v).match(/[a-z0-9]+/g)||[]).filter(w=>!STOP.has(w)||/^\d+$/.test(w)))];if(!terms.length)return route();
if(/^\d+$/.test(v.trim())&&byN[+v]){location.hash='/a/'+(+v);return}
main.style.cssText='';const accs=terms.map(accepted),inL=a=>!lib||N[root(nodeOf[a.n])].i==+lib;
const run=need=>A.filter(a=>inL(a)&&accs.filter(x=>hasAcc(a.k,x)).length>=need);
let rs=run(terms.length),partial=false;if(!rs.length&&terms.length>1){partial=true;rs=run(Math.max(1,Math.ceil(terms.length/2)))}
rs=rs.map(a=>({a,s:accs.some(x=>hasAcc(norm(a.t),x))?0:1,k:accs.filter(x=>hasAcc(a.k,x)).length})).sort((x,y)=>y.k-x.k||x.s-y.s||x.a.n-y.a.n);
const snip=a=>{const b=a.p.join(' ');let ix=0;const nb=norm(b);for(const x of accs.flat()){const j=nb.indexOf(x);if(j>=0){ix=j;break}}const st=Math.max(0,ix-70);return(st?'…':'')+b.slice(st,st+240)+(b.length>st+240?'…':'')};
main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Búsqueda</span></nav><div class="sec"><h2>Resultados para «${esc(v)}»</h2><span>${rs.length} artículo${rs.length==1?'':'s'}${lib?' · '+esc(label(N[+lib])):''}</span></div><p class="hint">${partial?'Coincidencia parcial: no hay artículos con todas las palabras, se muestran los que tienen al menos la mitad. ':''}La búsqueda entiende varias palabras en cualquier orden, sinónimos y números (5 = cinco), y también busca dentro del texto completo.</p><div class="res">${rs.slice(0,60).map(({a})=>{const n=N[nodeOf[a.n]];return `<article class="art"><header><div class="num">Art. ${a.n}</div><div><h4>${hl(a.t,accs)}<small>${esc(label(N[root(n.i)])+' › '+n.kind+' · '+n.name)}</small></h4><p class="sum">${hl(snip(a),accs)}</p></div></header><div class="acts"><a class="btn sm" href="#/a/${a.n}">Abrir artículo en su sección</a></div></article>`}).join('')||'<p>Sin coincidencias. Probá con otra palabra o quitá el filtro de Sección.</p>'}</div>`}
/* Honorarios mínimos */
function minView(){main.style.cssText='';
main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Honorarios mínimos</span></nav>
<header class="nh" style="--ac:var(--burg)"><span class="eyebrow" style="color:var(--burg)">Calculadora</span><h1>Honorarios mínimos</h1><div class="meta"><span>${M.length} mínimos de la Ley</span><button class="ib" style="margin-left:auto" onclick="window.print()">🖨 Imprimir</button></div></header>
<div class="box"><h4>Cómo se usa</h4><p>Ingresá el valor vigente del salario mínimo, vital y móvil (SMVM) para ver el monto en pesos de cada mínimo. El SMVM cambia con frecuencia: use siempre el vigente al momento de la regulación.</p></div>
<div class="ctl"><input type="number" id="sm" min="0" step="any" placeholder="SMVM vigente ($)"><input type="search" id="mq" placeholder="Buscar por concepto o artículo…"></div><div id="mb"></div>`;
['sm','mq'].forEach(id=>$('#'+id).oninput=drawM);drawM()}
const money=v=>'$ '+v.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
function drawM(){const q=norm($('#mq').value).split(/\s+/).filter(Boolean),sm=parseFloat($('#sm').value);
const rs=M.filter(r=>{const k=norm('art '+r[0]+' '+r[1]+' '+r[2]);return q.every(w=>k.includes(w))});
$('#mb').innerHTML=`<p class="cnt">${rs.length} resultado${rs.length==1?'':'s'}</p><table class="tb"><thead><tr><th>Art.</th><th>Concepto</th><th>Mínimo</th><th>Monto</th></tr></thead><tbody>${rs.map(r=>{const n=parseInt(r[0]);return `<tr><td data-l="Artículo"><a class="chip" href="#/a/${n}">${r[0]}</a></td><td data-l="Concepto">${esc(r[1])}</td><td data-l="Mínimo"><b>${esc(r[2])}</b></td><td data-l="Monto">${sm>0?`<span class="bd">${money(sm*r[3])}</span>`:'<span class="nt">Ingrese SMVM</span>'}</td></tr>`}).join('')||'<tr><td colspan="4">Sin resultados.</td></tr>'}</tbody></table>`}
function route(){const h=location.hash.slice(1)||'/',m=h.match(/^\/(n|a)\/(\d+)/);side.classList.remove('open');main.style.cssText='';
{const ri=m?(m[1]=='n'?+m[2]:nodeOf[+m[2]]):null;setLib(ri!=null&&N[ri]?String(root(ri)):'')}
if(h=='/minimos'){minView();window.scrollTo(0,0);return}
if(!m){home();window.scrollTo(0,0);side.querySelectorAll('.l.on').forEach(x=>x.classList.remove('on'));return}
if(m[1]=='n'&&N[+m[2]]){nodeView(+m[2]);window.scrollTo(0,0)}
else if(m[1]=='a'&&byN[+m[2]]){const n=+m[2];nodeView(nodeOf[n]);const e=document.getElementById('a'+n);if(e){e.classList.add('hit');e.querySelector('.full').hidden=false;e.querySelector('[data-act=t]').textContent='Ocultar texto completo';setTimeout(()=>e.scrollIntoView({block:'start'}),30)}}
else home()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,art=b.closest('.art');
if(act=='t'){const f=art.querySelector('.full');f.hidden=!f.hidden;b.textContent=f.hidden?'Ver texto completo':'Ocultar texto completo'}
else if(act=='all'||act=='none')document.querySelectorAll('.art').forEach(x=>{x.querySelector('.full').hidden=act=='none';x.querySelector('[data-act=t]').textContent=act=='none'?'Ver texto completo':'Ocultar texto completo'});
else if(act=='c'){const a=byN[+b.dataset.n];navigator.clipboard.writeText(`ARTÍCULO ${a.n}.- ${a.t}.\n\n`+a.p.join('\n')+'\n').then(()=>toast('Texto copiado'),()=>toast('No se pudo copiar'))}
else if(act=='l'){const u=location.href.split('#')[0]+'#/a/'+b.dataset.n;navigator.clipboard.writeText(u).then(()=>toast('Enlace copiado'),()=>toast('No se pudo copiar'))}});
$('#home').onclick=()=>{$('#q').value='';location.hash='/';route()};
let tm;$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>search(e.target.value),180)};
$('#menu').onclick=()=>side.classList.toggle('open');
addEventListener('hashchange',()=>{$('#q').value='';route()});
$('#fc').innerHTML='<button class="chip" data-l="" aria-pressed="true">Todas</button>'+secs.map(l=>`<button class="chip" data-l="${l.i}" aria-pressed="false">Sección ${l.num}</button>`).join('');
$('#fc').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;setLib(b.dataset.l);const v=$('#q').value;if(v.trim())search(v);else location.hash=lib?'/n/'+lib:'/'};
const th=()=>document.documentElement.style.setProperty('--th',$('.top').offsetHeight+'px');addEventListener('resize',th);document.fonts&&document.fonts.ready.then(th);th();
addEventListener('beforeprint',()=>document.querySelectorAll('.full').forEach(f=>f.hidden=false));
nav();route();th();
