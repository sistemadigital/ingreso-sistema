<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Panel Federal de Diligenciadores</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        :root {
            --dark-blue: #0d1b3e;
            --celeste-argentina: #74ACDF;
            --gm-blue: #1a73e8;
            --province-panel-width: 220px;
            --search-panel-width: 320px;
        }

        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Roboto', sans-serif; background: #f1f3f4; }

        .main-container {
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 5px solid var(--dark-blue);
            border-radius: 12px;
            display: flex;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* ══════════ SIDEBAR PROVINCIAS ══════════ */
        .province-sidebar {
            width: var(--province-panel-width);
            background: #f8f9fa;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            z-index: 1001;
            flex: none;
        }
        .province-sidebar h3 {
            padding: 20px 15px; font-size: 13px; color: var(--dark-blue);
            margin: 0; text-transform: uppercase; border-bottom: 2px solid var(--dark-blue);
            letter-spacing: 1px; font-weight: 700;
        }
        .province-list { overflow-y: auto; flex: 1; }
        .province-item {
            padding: 12px 18px; cursor: pointer; font-size: 14px; color: #333;
            transition: all 0.2s; border-bottom: 1px solid #eee;
        }
        .province-item:hover { background: #e8f0fe; }
        .province-item.active { background: var(--dark-blue); color: white; font-weight: 700; }

        /* ══════════ SIDEBAR BÚSQUEDA ══════════ */
        .search-sidebar {
            width: var(--search-panel-width);
            background: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            flex: none;
        }
        .search-box { padding: 15px; }
        .search-box input {
            width: 100%; padding: 12px; border: 1px solid #ddd;
            border-radius: 8px; outline: none; box-sizing: border-box;
            font-family: inherit; font-size: 14px;
        }
        .search-box input:focus { border-color: var(--gm-blue); box-shadow: 0 0 0 3px rgba(26,115,232,.15); }
        #results-list { flex: 1; overflow-y: auto; }

        /* ══════════ ESCENARIO / MAPA ══════════ */
        .map-stage {
            flex: 1;
            position: relative;
            background: #DCEAF5;
            min-width: 0;
            overflow: hidden;
        }
        #gmap {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            transition: opacity .4s ease;
        }
        .map-stage::after {
            content: '';
            position: absolute; inset: 0;
            pointer-events: none;
            z-index: 3;
            box-shadow: inset 0 0 0 1px rgba(13,27,62,.08);
        }

        /* Loader */
        .map-loader {
            position: absolute; inset: 0; z-index: 6;
            display: grid; place-items: center;
            background: rgba(241,243,244,.72);
            backdrop-filter: blur(5px);
            transition: opacity .35s ease;
        }
        .map-loader.hidden { opacity: 0; pointer-events: none; }
        .falls { display: flex; gap: 5px; height: 44px; justify-content: center; }
        .falls i {
            width: 5px; height: 44px; border-radius: 4px;
            background: linear-gradient(var(--celeste-argentina), var(--dark-blue));
            transform-origin: top;
            animation: fall 1.05s ease-in-out infinite;
        }
        .falls i:nth-child(2) { animation-delay: .12s; }
        .falls i:nth-child(3) { animation-delay: .24s; }
        .falls i:nth-child(4) { animation-delay: .36s; }
        .falls i:nth-child(5) { animation-delay: .48s; }
        @keyframes fall {
            0%, 100% { transform: scaleY(.15); opacity: .35; }
            50%      { transform: scaleY(1);   opacity: 1; }
        }
        .map-loader p {
            margin: 15px 0 0; text-align: center;
            font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
            color: var(--dark-blue); font-weight: 700;
        }

        /* HUD del mapa */
        .map-hud {
            position: absolute; top: 16px; right: 16px; z-index: 7;
            display: flex; align-items: stretch; gap: 3px; padding: 5px;
            border-radius: 14px;
            background: rgba(255,255,255,.94);
            backdrop-filter: blur(10px);
            border: 1px solid #d5dee8;
            box-shadow: 0 4px 16px rgba(13,27,62,.14);
            transition: right .3s ease;
        }
        .map-stage.panel-open .map-hud { right: 356px; }
        .map-hud button, .map-hud a {
            min-width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            background: transparent; border: 0; border-radius: 10px;
            color: var(--dark-blue); font-size: 17px; font-weight: 700;
            text-decoration: none; cursor: pointer; font-family: inherit;
            transition: background .15s, transform .15s;
        }
        .map-hud button:hover, .map-hud a:hover { background: rgba(13,27,62,.09); }
        .map-hud button:active { transform: scale(.94); }
        #zlvl {
            display: grid; place-items: center; padding: 0 8px;
            font-size: 11px; color: var(--gm-blue); font-weight: 700; letter-spacing: .06em;
        }
        .map-hud .sep { width: 1px; background: #d5dee8; margin: 7px 2px; }

        /* Botón reiniciar */
        .btn-reset {
            position: absolute; bottom: 20px; left: 20px;
            z-index: 7; background: white; border: 2px solid var(--dark-blue);
            border-radius: 50px; padding: 10px 20px; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            font-weight: bold; color: var(--dark-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s; font-family: inherit; font-size: 14px;
        }
        .btn-reset:hover { background: var(--dark-blue); color: white; }

        /* ══════════ PANEL DE DETALLE ══════════ */
        .details-sidebar {
            position: absolute; top: 0; right: 0;
            width: 340px; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            border-left: 2px solid var(--dark-blue);
            box-shadow: -5px 0 20px rgba(0,0,0,0.15);
            z-index: 1100; overflow-y: auto; display: none;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .details-head {
            padding: 22px 25px; background: var(--dark-blue); color: white;
            position: relative;
        }
        .details-head .eyebrow {
            font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
            opacity: .7; font-weight: 700;
        }
        .details-head h2 { margin: 8px 0 4px; font-size: 18px; line-height: 1.25; }
        .details-head .sub { font-size: 11px; opacity: .8; }
        .details-close {
            position: absolute; top: 14px; right: 14px;
            width: 28px; height: 28px; border-radius: 8px; border: 0;
            background: rgba(255,255,255,.15); color: white;
            font-size: 13px; cursor: pointer; line-height: 1;
            display: grid; place-items: center;
            transition: background .15s; font-family: inherit;
        }
        .details-close:hover { background: rgba(255,255,255,.32); }

        .data-row { padding: 15px 25px; border-bottom: 1px solid #f0f0f0; }
        .label { font-size: 10px; color: var(--gm-blue); font-weight: bold; text-transform: uppercase; letter-spacing: .06em; }
        .value { font-size: 14px; color: #222; margin-top: 4px; line-height: 1.5; }

        .nota {
            padding: 20px; background: #fff9e6; margin: 15px; border-radius: 8px;
            font-size: 13px; color: #555; border-left: 4px solid #ff9800;
            line-height: 1.55;
        }
        .nota .label { color: #ff9800; margin-bottom: 5px; }

        .btn-gmaps {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin: 16px; padding: 12px; border-radius: 9px;
            background: var(--gm-blue); color: #fff; text-decoration: none;
            font-weight: 700; font-size: 13px; transition: filter .15s;
        }
        .btn-gmaps:hover { filter: brightness(1.1); }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-thumb { background: #c3d3e2; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--celeste-argentina); }
        ::-webkit-scrollbar-track { background: transparent; }

        @media (max-width: 900px) {
            :root { --province-panel-width: 150px; --search-panel-width: 220px; }
            .map-stage.panel-open .map-hud { right: 16px; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="province-sidebar">
        <h3>Jurisdicciones</h3>
        <div class="province-list" id="province-list"></div>
    </div>

    <div class="search-sidebar">
        <div class="search-box">
            <input type="text" id="input-search" placeholder="🔍 Buscar diligenciador..." oninput="buscar(this.value)">
        </div>
        <div id="results-list"></div>
    </div>

    <!-- ══════════ MAPA EMBEBIDO GOOGLE ══════════ -->
    <div class="map-stage" id="stage">
        <iframe id="gmap"
                title="Mapa de diligenciadores"
                referrerpolicy="no-referrer-when-downgrade"
                allow="fullscreen"></iframe>

        <div class="map-loader" id="loader">
            <div>
                <div class="falls"><i></i><i></i><i></i><i></i><i></i></div>
                <p>Posicionando en el mapa…</p>
            </div>
        </div>

        <div class="map-hud">
            <button id="zOut" title="Alejar" aria-label="Alejar">−</button>
            <div id="zlvl">Z 4</div>
            <button id="zIn" title="Acercar" aria-label="Acercar">+</button>
            <div class="sep"></div>
            <button id="fs" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
            <a id="gmaps" target="_blank" rel="noopener" title="Abrir en Google Maps">↗</a>
        </div>

        <button class="btn-reset" onclick="resetMapa()">
            <span class="material-icons">refresh</span> Reiniciar Mapa
        </button>
    </div>

    <div class="details-sidebar" id="details-panel"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD8nUKvZMx6HzVKFzMbV68aGWXABZ4lNR4",
        authDomain: "diligenciadores.firebaseapp.com",
        projectId: "diligenciadores",
        storageBucket: "diligenciadores.firebasestorage.app",
        messagingSenderId: "962737479020",
        appId: "1:962737479020:web:1edcb50718c2cda907e749"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    /* ══════════ ESTADO GLOBAL ══════════ */
    let diligenciadores = [];
    let provinciaActual = "";

    const provinciasList = [
        "AMBA", "CABA", "Buenos Aires", "Catamarca", "Chaco", "Chubut", "Córdoba", "Corrientes",
        "Entre Ríos", "Formosa", "Jujuy", "La Pampa", "La Rioja", "Mendoza",
        "Misiones", "Neuquén", "Río Negro", "Salta", "San Juan", "San Luis",
        "Santa Cruz", "Santa Fe", "Santiago del Estero", "Tierra del Fuego", "Tucumán"
    ];

    // Lista exacta de la imagen proporcionada (41 entradas)
    const listaAMBA_Imagen = [
        "ALMIRANTE BROWN", "AVELLANEDA", "BERAZATEGUI", "BERISSO", "BRANDSEN", "CABA",
        "CAMPANA", "CAÑUELAS", "ENSENADA", "ESCOBAR", "ESTEBAN ECHEVERRIA", "EXALTACION DE LA CRUZ",
        "EZEIZA", "FLORENCIO VARELA", "GENERAL LAS HERAS", "GENERAL RODRIGUEZ", "GENERAL SAN MARTIN",
        "HURLINGHAM", "ITUZAINGO", "JOSE C. PAZ", "LA MATANZA", "LANUS", "LA PLATA",
        "LOMAS DE ZAMORA", "LUJAN", "MARCOS PAZ", "MALVINAS ARGENTINAS", "MORENO", "MERLO",
        "MORON", "PILAR", "PRESIDENTE PERON", "QUILMES", "SAN FERNANDO", "SAN ISIDRO",
        "SAN MIGUEL", "SAN VICENTE", "TIGRE", "TRES DE FEBRERO", "VICENTE LOPEZ", "ZARATE"
    ];

    const normalizar = (str) => str ? str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim() : "";

    /* ══════════ VISTA DEL MAPA (GOOGLE MAPS EMBEBIDO) ══════════ */
    const ARG_VISTA = { lat: -38.45, lng: -63.60, z: 4 };

    const estado  = { lat: ARG_VISTA.lat, lng: ARG_VISTA.lng, z: ARG_VISTA.z, sel: null };
    let   contexto = { lat: ARG_VISTA.lat, lng: ARG_VISTA.lng, z: ARG_VISTA.z };

    const frame  = document.getElementById('gmap');
    const loader = document.getElementById('loader');
    const stage  = document.getElementById('stage');

    let loadTimer = null;

    function mostrarLoader() {
        loader.classList.remove('hidden');
        frame.style.opacity = .12;
        clearTimeout(loadTimer);
        loadTimer = setTimeout(ocultarLoader, 8000);
    }
    function ocultarLoader() {
        loader.classList.add('hidden');
        frame.style.opacity = 1;
        clearTimeout(loadTimer);
    }
    frame.addEventListener('load', ocultarLoader);

    function urlMapa() {
        if (estado.sel) {
            const d = estado.sel;
            const q = [d.domicilio, d.localidad, d.provincia, 'Argentina']
                        .filter(Boolean).join(', ');
            return `https://www.google.com/maps?q=${encodeURIComponent(q)}&z=${estado.z}&hl=es&output=embed`;
        }
        return `https://www.google.com/maps?ll=${estado.lat},${estado.lng}&z=${estado.z}&hl=es&output=embed`;
    }

    function urlGoogleMaps() {
        if (estado.sel) {
            const d = estado.sel;
            const q = [d.domicilio, d.localidad, d.provincia, 'Argentina']
                        .filter(Boolean).join(', ');
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
        }
        return `https://www.google.com/maps/@${estado.lat},${estado.lng},${estado.z}z`;
    }

    function cargarMapa() {
        const src = urlMapa();
        document.getElementById('zlvl').textContent = 'Z ' + estado.z;
        document.getElementById('gmaps').href = urlGoogleMaps();

        if (frame.dataset.src === src) { ocultarLoader(); return; }
        frame.dataset.src = src;
        mostrarLoader();
        frame.src = src;
    }

    /* Convertir bounding boxes (Nominatim) en centro + zoom aproximado */
    function cajasAVista(cajas) {
        let s = 90, n = -90, w = 180, e = -180;
        cajas.forEach(b => {
            s = Math.min(s, b[0]); n = Math.max(n, b[1]);
            w = Math.min(w, b[2]); e = Math.max(e, b[3]);
        });
        const lat = (s + n) / 2;
        const lng = (w + e) / 2;
        const zLng = Math.log2(360 / Math.max(0.02, e - w));
        const zLat = Math.log2(360 / Math.max(0.02, n - s));
        let z = Math.round(Math.min(zLng, zLat));
        z = Math.max(4, Math.min(14, z));
        return { lat: +lat.toFixed(5), lng: +lng.toFixed(5), z };
    }

    /* ══════════ CONTROLES DEL MAPA ══════════ */
    document.getElementById('zIn').onclick = () => {
        estado.z = Math.min(18, estado.z + 1);
        if (!estado.sel) { contexto.z = estado.z; }
        cargarMapa();
    };
    document.getElementById('zOut').onclick = () => {
        estado.z = Math.max(3, estado.z - 1);
        if (!estado.sel) { contexto.z = estado.z; }
        cargarMapa();
    };
    document.getElementById('fs').onclick = () => {
        if (document.fullscreenElement) { document.exitFullscreen(); }
        else if (stage.requestFullscreen) { stage.requestFullscreen(); }
    };

    /* ══════════ CARGA INICIAL ══════════ */
    async function init() {
        try {
            const snap = await getDocs(collection(db, 'diligenciadores'));
            diligenciadores = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        } catch (e) {
            console.error('Firebase:', e);
            diligenciadores = [];
            document.getElementById('results-list').innerHTML =
                `<div style="padding:25px; color:#888; font-size:13px; text-align:center;">No se pudo cargar el listado.</div>`;
        }
        renderProvincias();
        renderLista(diligenciadores);
        cargarMapa();
    }

    function renderProvincias() {
        const container = document.getElementById('province-list');
        container.innerHTML = '';
        provinciasList.forEach(p => {
            const div = document.createElement('div');
            div.className = 'province-item';
            div.innerText = p;
            div.id = `item-${p.replace(/ /g, '')}`;
            div.onclick = () => filtrarProvincia(p);
            container.appendChild(div);
        });
    }

    /* ══════════ FILTRO POR PROVINCIA ══════════ */
    window.filtrarProvincia = (prov) => {
        provinciaActual = prov;
        cerrarDetalle(false);

        document.querySelectorAll('.province-item').forEach(i => i.classList.remove('active'));
        document.getElementById(`item-${prov.replace(/ /g, '')}`)?.classList.add('active');

        let filtrados;
        if (prov === "AMBA") {
            filtrados = diligenciadores.filter(d => {
                const p = normalizar(d.provincia);
                const l = normalizar(d.localidad);
                return listaAMBA_Imagen.includes(p) || listaAMBA_Imagen.includes(l);
            });
        } else {
            filtrados = diligenciadores.filter(d => normalizar(d.provincia) === normalizar(prov));
        }
        renderLista(filtrados);
        centrarProvincia(prov);
    };

    async function centrarProvincia(prov) {
        let queries;
        if (prov === "Tierra del Fuego") {
            queries = ["Provincia de Tierra del Fuego, Argentina", "Islas Malvinas"];
        } else if (prov === "AMBA") {
            queries = ["Área Metropolitana de Buenos Aires, Argentina"];
        } else if (prov === "CABA") {
            queries = ["Ciudad Autónoma de Buenos Aires, Argentina"];
        } else if (prov === "Chaco") {
            queries = ["Provincia del Chaco, Argentina"];
        } else if (prov === "Chubut") {
            queries = ["Provincia del Chubut, Argentina"];
        } else {
            queries = [`Provincia de ${prov}, Argentina`];
        }

        mostrarLoader();
        try {
            const results = await Promise.all(
                queries.map(q =>
                    fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`)
                        .then(r => r.json())
                        .catch(() => [])
                )
            );
            const cajas = results
                .filter(r => r[0] && r[0].boundingbox)
                .map(r => r[0].boundingbox.map(Number));

            if (!cajas.length) { ocultarLoader(); return; }

            const vista = cajasAVista(cajas);
            contexto = { lat: vista.lat, lng: vista.lng, z: vista.z };
            estado.lat = vista.lat;
            estado.lng = vista.lng;
            estado.z   = vista.z;
            estado.sel = null;
            cargarMapa();
        } catch (e) {
            console.error(e);
            ocultarLoader();
        }
    }

    /* ══════════ RESET ══════════ */
    window.resetMapa = () => {
        cerrarDetalle(false);
        provinciaActual = "";
        contexto = { lat: ARG_VISTA.lat, lng: ARG_VISTA.lng, z: ARG_VISTA.z };
        estado.lat = ARG_VISTA.lat;
        estado.lng = ARG_VISTA.lng;
        estado.z   = ARG_VISTA.z;
        estado.sel = null;

        document.querySelectorAll('.province-item').forEach(i => i.classList.remove('active'));
        document.getElementById('input-search').value = "";
        renderLista(diligenciadores);
        cargarMapa();
    };

    /* ══════════ BÚSQUEDA ══════════ */
    window.buscar = (term) => {
        const query = normalizar(term);
        const filtrados = diligenciadores.filter(d => {
            const p = normalizar(d.provincia);
            const l = normalizar(d.localidad);
            const matchProv = (!provinciaActual)
                ? true
                : (provinciaActual === "AMBA"
                    ? (listaAMBA_Imagen.includes(p) || listaAMBA_Imagen.includes(l))
                    : p === normalizar(provinciaActual));
            return matchProv && (normalizar(d.diligenciador).includes(query) || l.includes(query));
        });
        renderLista(filtrados);
    };

    /* ══════════ LISTADO ══════════ */
    function renderLista(data) {
        const list = document.getElementById('results-list');
        if (data.length === 0) {
            list.innerHTML = `<div style="padding:25px; color:#888; font-size:13px; text-align:center;">No se encontraron registros.</div>`;
            return;
        }
        list.innerHTML = data.map(d => `
            <div class="data-row" style="cursor:pointer" onclick="verDetalle('${d.id}')">
                <div class="value" style="font-weight:500; color:var(--dark-blue)">${d.diligenciador}</div>
                <div class="label">${d.localidad || ''}, ${d.provincia || ''}</div>
            </div>
        `).join('');
    }

    /* ══════════ DETALLE ══════════ */
    window.verDetalle = (id) => {
        const d = diligenciadores.find(x => x.id === id);
        if (!d) return;

        estado.sel = d;
        estado.z = d.domicilio ? 15 : 13;

        const panel = document.getElementById('details-panel');
        panel.style.display = 'block';
        panel.innerHTML = `
            <div class="details-head">
                <button class="details-close" onclick="cerrarDetalle()" aria-label="Cerrar">✕</button>
                <div class="eyebrow">Diligenciador</div>
                <h2>${d.diligenciador}</h2>
                <span class="sub">${d.tipoLey || 'Ley 22.172'}</span>
            </div>
            <div class="data-row">
                <div class="label">Ubicación</div>
                <div class="value">${d.domicilio || 'Sin domicilio'}<br>${d.localidad || ''}, ${d.provincia || ''}</div>
            </div>
            <div class="data-row">
                <div class="label">Contacto</div>
                <div class="value">${d.telefono || 'Sin datos'}<br>${d.email || ''}</div>
            </div>
            <div class="nota">
                <div class="label">Información Relevante</div>
                ${d.expteDondeFigura || 'Registrado en el Panel Federal.'}
            </div>
            <a class="btn-gmaps" href="${urlGoogleMaps()}" target="_blank" rel="noopener">
                Abrir en Google Maps ↗
            </a>
        `;

        stage.classList.add('panel-open');
        cargarMapa();
    };

    window.cerrarDetalle = (reubicar = true) => {
        const tenia = !!estado.sel;
        estado.sel = null;
        document.getElementById('details-panel').style.display = 'none';
        stage.classList.remove('panel-open');

        if (reubicar && tenia) {
            estado.lat = contexto.lat;
            estado.lng = contexto.lng;
            estado.z   = contexto.z;
            cargarMapa();
        }
    };

    init();
</script>

</body>
</html>
