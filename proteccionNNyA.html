const X={
1:"La presente ley tiene por finalidad garantizar el goce, ejercicio y la protección integral de los derechos de niños, niñas y adolescentes en la provincia de Misiones.",
2:"Los derechos y garantías enunciados en esta ley se entienden como complementarios de los reconocidos en la Constitución Nacional, Convención Internacional sobre los Derechos del Niño; las Reglas Mínimas de las Naciones Unidas para la Administración de la Justicia de menores (Reglas de Beijing), Resolución N.º 40/33 de la Asamblea General; las Reglas de las Naciones Unidas para la protección de los menores privados de libertad, Resolución N.º 45/113 de la Asamblea General y las Directrices de Naciones Unidas para la Prevención de la Delincuencia Juvenil (Directrices de Riad); demás convenciones y tratados internacionales en los que el Estado argentino sea parte; leyes nacionales y la Constitución de la Provincia de Misiones.",
3:"A los efectos de esta ley, se considera niño o niña a toda persona hasta los dieciocho (18) años de edad, entendiéndose como adolescencia la etapa de niñez comprendida entre los trece (13) y hasta los dieciocho (18) años. En caso de duda se presume la edad de niño, niña y adolescente establecida en esta ley y prevalece la condición de adolescente ante la de adulto y de niño, niña ante la de adolescente, hasta tanto se pruebe lo contrario.",
4:"El interés superior de niños, niñas y adolescentes, es un principio de interpretación y aplicación de esta ley, dirigido a asegurar el desarrollo integral de los niños, niñas y adolescentes, así como el goce y ejercicio pleno y efectivo de sus derechos y garantías. Es de obligatorio cumplimiento en la toma de todas las decisiones concernientes a los niños, niñas y adolescentes.\nPara determinar el interés superior del niño, niña y adolescente en una situación concreta se debe apreciar lo siguiente:\n1) la opinión del niño, niña y adolescente;\n2) la necesidad de equilibrio entre los derechos y garantías del niño, niña y adolescente y sus deberes;\n3) la necesidad de equilibrio entre los derechos y garantías del niño, niña y adolescente y las exigencias del bien común;\n4) la necesidad de equilibrio entre los derechos y garantías del niño, niña y adolescente y los derechos de las personas adultas;\n5) la condición específica del niño, niña y adolescente, como personas.\nEn aplicación del interés superior del niño, niña y adolescente, cuando exista conflicto entre los derechos e intereses de los niños, niñas y adolescentes frente a otros derechos e intereses igualmente legítimos, prevalecen los primeros.",
5:"El niño, niña y adolescente es titular de todos los derechos y garantías fundamentales inherentes a su condición de persona y de la protección jurídica y derechos específicos consagrados en esta ley. La Provincia promueve su participación social y las máximas oportunidades para su pleno desarrollo físico, psíquico, moral, espiritual y social, en condiciones de libertad, igualdad, dignidad y equidad.",
6:"Es indelegable e imprescriptible la responsabilidad de las áreas gubernamentales del Estado en la adopción de medidas administrativas, legislativas y de otra índole para la plena satisfacción de los derechos de los niños, niñas y adolescentes.",
7:"Es responsabilidad conjunta de la familia, la sociedad y el Estado, asegurar a los niños, niñas y adolescentes con absoluta prioridad, la efectivización de los derechos a la vida, la salud, la libertad, la identidad, la alimentación, la educación, la vivienda, la cultura, a ser oídos y que sus opiniones sean tenidas en cuenta, a recibir guía y orientación para ejercer los derechos reconocidos, a buscar y recibir información, a no ser discriminados, a la recreación, al deporte, a la formación integral, a la convivencia familiar y comunitaria. La familia procura su constitución como grupo caracterizado por relaciones de respeto mutuo, equidad, igualdad, no discriminación por razones de sexo en la asunción de los roles entre adultos y en relación a los niños, niñas y adolescentes.",
8:"Los niños, niñas y adolescentes tienen prioridad en la:\n1) protección y auxilio cualquiera sea la circunstancia;\n2) atención en los servicios públicos;\n3) asignación de recursos públicos en el diseño, formulación y ejecución de políticas en las áreas relacionadas con la efectivización y la protección de los derechos de niños, niñas, adolescentes y la familia;\n4) consideración y ponderación de las necesidades y problemáticas de la comunidad local a la que pertenecen.",
9:"El diseño de la política respecto a la infancia-adolescencia, se basa en el fortalecimiento de la familia y de las redes de solidaridad social, implementando planes que facilitan el acceso a los bienes y servicios a toda la población como efectiva práctica de la superación de las desigualdades y de la exclusión social, promoviendo la protección de derechos mediante la implementación de un sistema que garantice la eficiencia de los servicios de apoyo familiar y social.",
10:"En la interpretación y aplicación de la presente ley se tiene en cuenta la condición del niño, niña y adolescente como sujeto titular de derechos y deberes, contemplándose especialmente su condición de persona en desarrollo. El niño, niña y adolescente tienen participación activa en la sociedad y no pueden ser considerados objeto de socialización, control o prueba.",
11:"Los niños, niñas y adolescentes tienen derecho a la vida, a su disfrute y protección, a la seguridad y libertad ambulatoria. Tienen derecho a la salud desde una perspectiva integral. Derecho a la dignidad, identidad en todas sus dimensiones y fases, y a ser sujetos titulares de todos los derechos humanos, para lo cual se adoptan garantías complementarias de las que corresponden a todas las personas, a través de la confluencia de medidas de efectivización y medidas que aseguren su protección.",
12:"El niño, niña y adolescente tiene derecho a la salud desde una perspectiva integral, a ese efecto el Estado provincial adopta medidas para:\n1) reducir la morbimortalidad;\n2) prevenir y combatir enfermedades y la malnutrición;\n3) garantizar al niño, niña y adolescente y a los miembros de la familia conviviente el acceso a la información de principios básicos de salud y nutrición, salud reproductiva, el derecho a la lactancia materna, la higiene, el saneamiento ambiental y todas las medidas de cuidado y prevención;\n4) asegurar la atención sanitaria preventiva, y el reconocimiento del derecho a la salud reproductiva planteando la salud como meta;\n5) proveer gratuitamente a los niños, niñas y adolescentes de familias de escasos recursos, atención médica, medicamentos, prótesis u otros elementos necesarios para su tratamiento y rehabilitación;\n6) garantizar la aplicación de los principios consagrados en esta ley en materia de prestaciones y seguimientos relativos a la salud mental;\n7) garantizar la atención de la salud a toda niña embarazada;\n8) vacunar gratuitamente según el esquema vigente;\n9) proporcionar condiciones dignas para que los padres o miembros de la familia ampliada responsable del cuidado del niño, niña o adolescente, permanezcan todo el tiempo durante el cual se prolongue la internación en establecimientos de salud;\n10) garantizar el derecho a niños y niñas a gozar de la lactancia materna, inclusive aquellos cuyas madres cumplen penas privativas de libertad, durante un período no menor de veinticuatro (24) meses consecutivos a partir del momento del nacimiento, sin que pueda separarse al niño o niña de su madre, y proporcionando lugares especiales para la comunicación entre madre e hijo.",
13:"Los establecimientos públicos y privados que realizan atención del embarazo, del parto y del recién nacido, están obligados a:\n1) conservar las historias clínicas individuales por el plazo de treinta (30) años;\n2) determinar pesquisas y terapéutica de enfermedades congénitas del metabolismo en el período neonatal, así como prestar orientación a los padres;\n3) proveer una declaración de nacimiento donde conste lo ocurrido en el parto y el desenvolvimiento del neonato;\n4) posibilitar la permanencia del neonato junto con la madre;\n5) ejecutar acciones planificadas y programadas, focalizadas hacia los grupos de mayor vulnerabilidad, para garantizar el adecuado seguimiento del embarazo, parto, puerperio de la madre;\n6) garantizar la atención de todas las enfermedades perinatales en el ámbito estatal y privado.",
14:"El derecho del niño, niña y adolescente a la identidad comprende el derecho a una nacionalidad, a un nombre, a su cultura, a su lengua de origen, a su orientación sexual, a conocer la identidad de ambos progenitores y a las relaciones familiares sin injerencias ilícitas.\nEn caso de privación ilegal de algunos o todos los elementos de la identidad, el Estado provincial presta asistencia y protección apropiadas para restablecer el derecho rápidamente.",
15:"Como medidas para efectivizar el derecho a la identidad, el Estado provincial debe:\n1) identificar al recién nacido mediante el procedimiento que establece la normativa vigente;\n2) inscribir al niño, niña o adolescente. En ningún caso la indocumentación de la madre o del padre es obstáculo para que se inscriba al recién nacido o las personas menores de dieciocho (18) años de edad;\n3) facilitar y colaborar para obtener información, la búsqueda o localización de los padres u otros familiares del niño, niña o adolescente, propiciando el reencuentro familiar.",
16:"Los niños, niñas y adolescentes tienen derecho a la integridad biopsicosocial, a la intimidad, a la privacidad, a la autonomía personal, social y jurídica; al respeto a sus valores, ideas o creencias y a sus espacios y objetos personales.",
17:"Todos los niños, niñas y adolescentes tienen derecho a la libertad ambulatoria sin más límites que los establecidos por ley. No pueden ser privados de ella ilegal o arbitrariamente.\nPor privación de libertad se entiende toda forma de detención o encarcelamiento, así como internación en un establecimiento público o privado del que no se permita salir al niño, niña o adolescente por su propia voluntad.\nLa privación de libertad de niños, niñas y adolescentes se debe realizar de conformidad con la ley, por tiempo determinado y se aplicará como medida de último recurso por el período más breve que proceda.\nTodos los niños, niñas y adolescentes tienen derecho al control judicial de la privación de la libertad ambulatoria y al amparo de su libertad ambulatoria de conformidad con la ley.",
18:"El niño, niña y adolescente tienen derecho a ser oídos y a que sus opiniones sean tenidas en cuenta en cualquier ámbito, cuando se trata de sus intereses o al encontrarse involucrados en cuestiones o procedimientos relativos a sus derechos.",
19:"Es responsabilidad de la familia, la sociedad y el Estado proteger la dignidad del niño, niña y adolescente como sujeto de derechos humanos, impidiendo que sean sometidos a trato violento, discriminatorio, vejatorio, humillante, intimidatorio, a prostitución, explotación sexual o a cualquier condición inhumana o degradante.",
20:"El respeto al niño, niña y adolescente consiste en brindarle comprensión, propiciar oportunidades para el despliegue de sus actividades, promover el desarrollo de sus potencialidades individuales, y garantizar el goce y ejercicio de sus derechos con el protagonismo activo inherente a las prácticas cívicas acordes con su edad y responsabilidades.",
21:"No se admite discriminación ni segregación por razones o con pretexto de raza, etnia, sexo, género, edad, ideología, religión, opinión, nacionalidad, caracteres físicos, condición psicofísica, social, económica, creencias culturales o cualquier otra circunstancia que implica exclusión o menoscabo de los niños, niñas y adolescentes.",
22:"El niño, niña y adolescente tienen derecho a ser criados y cuidados por sus padres y a permanecer en su grupo familiar de origen, en una convivencia sustentada en vínculos y relaciones de igualdad y equidad, afectivas y comunitarias.\nLa convivencia dentro de otros grupos familiares es considerada en circunstancias excepcionales.\nEl Estado respeta las responsabilidades de los padres, sin injerencias arbitrarias en la vida familiar.\nLa carencia o insuficiencia de recursos materiales del padre, madre o responsable no constituye causa para la separación del niño, niña y adolescente de su grupo familiar. Es responsabilidad del Estado en esos casos incluir a los miembros de la familia y a falta de ella, de la familia ampliada y de la comunidad según la costumbre local, en programas de asistencia y orientación a la familia.",
23:"El derecho a la educación a través del sistema de enseñanza formal y acciones educativas no formales contribuye al afianzamiento de valores basados en el reconocimiento de los derechos humanos, la pluralidad cultural, la diversidad, el medio ambiente, los recursos naturales y los bienes sociales, preparando al niño, niña y adolescente para asumir como ciudadano las responsabilidades de su vida en una sociedad democrática.",
24:"El derecho reconocido en el artículo anterior comprende los derechos a:\n1) ser respetado por parte de todos los integrantes de la comunidad educativa;\n2) ser oído con anterioridad a la aplicación de cualquier medida o sanción disciplinaria, las que únicamente pueden tomarse a través de normas y procedimientos legales y previamente establecidos;\n3) recurrir a instancias escolares superiores o extra educativas en caso de aplicación de sanciones;\n4) ser evaluado por sus desempeños y logros conforme a las normas y procedimientos aceptados previamente y a conocer u objetar criterios de evaluación, pudiendo recurrir a instancias escolares superiores;\n5) constituir y participar en organizaciones estudiantiles;\n6) conocer los derechos que le son reconocidos, las acciones para su ejercicio y defensa y contar con patrocinio profesional sin costo, en caso de carencia de recursos.",
25:"Como medidas de acción positiva de efectividad de los derechos reconocidos en los artículos 23 y 24 de la presente, el Estado provincial garantiza:\n1) el acceso al conocimiento e información de los procedimientos para la construcción de las normativas de convivencia y su participación en la formulación;\n2) el diseño e implementación de lineamientos curriculares acordes con las necesidades del niño, niña y adolescente según su sexo y edad y que viabilicen el desarrollo máximo de las potencialidades individuales;\n3) la implementación de investigaciones, nuevas propuestas y tecnologías relativas a los diseños curriculares, con miras a dar respuesta a las necesidades de integración de la diversidad de la población infantil y adolescente en la educación común;\n4) la constitución de instancias escolares superiores o extra educativas para recurrir las sanciones dispuestas;\n5) el contralor del cumplimiento de las distintas funciones que ejercen cada uno de los organismos en sus competencias específicas.",
26:"El Estado adopta medidas que posibilitan el goce efectivo de los derechos a la recreación, al juego, al deporte y al descanso.",
27:"El Estado provincial y los municipios que adhieren a la presente ley, facilitan y promueven la asignación de recursos para financiar planes, programas y proyectos culturales, recreativos y deportivos, impulsando iniciativas de diseño e implementación, que promueven el protagonismo de las organizaciones de la sociedad civil y del niño, niña y adolescente, integrando la participación de niños, niñas o adolescentes con discapacidades.",
28:"Es responsabilidad de los organismos del Estado diseñar e implementar políticas específicas de prevención y erradicación del trabajo infantil.",
29:"Es responsabilidad de los organismos del Estado diseñar e implementar políticas específicas para la prevención y erradicación de cualquier forma de explotación de los niños, niñas y adolescentes, realizada para solventar sus necesidades, contribuir al sostenimiento familiar o de otras personas adultas.",
30:"Los niños, niñas y adolescentes tienen derecho a:\n1) informarse, expresarse y a que se tengan en cuenta sus opiniones;\n2) creer y profesar cultos religiosos;\n3) participar en la vida política;\n4) asociarse y celebrar reuniones;\n5) usar, transitar y permanecer en los espacios públicos.",
31:"El Estado garantiza a los niños, niñas y adolescentes en todo proceso legal, los principios y garantías procesales reconocidos a las personas adultas y los inherentes a la protección complementaria de la que son sujetos titulares, en especial:\n1) a ser considerado inocente hasta tanto se demuestre su culpabilidad;\n2) al pleno y formal conocimiento del acto infractor que se le atribuye y de las garantías procesales con que cuenta. Todo ello debe ser explicado en forma suficiente, oportuna y adecuada al nivel cultural del niño, niña y adolescente;\n3) a la igualdad en la relación procesal, a cuyo efecto puede producir toda la prueba que resulta conducente para su defensa;\n4) a la asistencia técnica letrada especializada para la defensa de sus derechos, independientemente de la representación complementaria del artículo 103 del Código Civil y Comercial de la Nación;\n5) a tener participación activa en el proceso y a ser oído personalmente por las autoridades competentes administrativas y judiciales;\n6) a negarse a declarar, sin que ello implique presunción en su contra;\n7) a solicitar la presencia inmediata de los padres o responsables a partir de su aprehensión o detención y en cualquier etapa del procedimiento;\n8) a que sus padres, responsables o personas con quien el niño, niña y adolescente tenga trato afectivo, sean informados de inmediato y en un plazo máximo de una hora, en caso de aprehensión o detención, del lugar donde se encuentra, hecho que se le imputa, tribunal y organismo de prevención intervinientes;\n9) a preservar su intimidad.",
32:"Ningún medio de comunicación social, público o privado, debe publicar o difundir informaciones que identifiquen o puedan dar lugar a la identificación de niños, niñas y adolescentes, víctimas o infractores de disposiciones penales o contravencionales, salvo las circunstancias de excepción prevista en el artículo 72.",
33:"A los fines de esta ley, se entiende por sistema de protección integral de derechos al conjunto de medidas, mecanismos y procedimientos articulados entre la familia, la comunidad y el Estado, tendientes a garantizar la efectividad del goce y ejercicio de los derechos del niño, niña y adolescente, reconociendo a la familia como primordial operador en la defensa, promoción y protección de tales derechos.",
34:"Las políticas públicas de protección integral de los derechos del niño, niña y adolescente, y la familia, se implementan mediante la concertación articulada transversalmente de acciones de la Provincia, los municipios que adhieren a la presente ley, con la participación de las organizaciones de la sociedad civil, promoviendo la amplia participación de los miembros de la comunidad, en especial de los niños, niñas y adolescentes, con la finalidad de lograr la vigencia y el goce pleno de los derechos y las garantías reconocidos en esta ley.\nA tal fin se promueve la descentralización en la atención de situaciones que pueden ser mejor resueltas por el municipio, con la participación de las organizaciones de la sociedad civil legalmente constituidas, privilegiando las realidades locales.",
35:"Las políticas públicas tienden a:\n1) fortalecer el rol de la familia como principal ejecutor de la efectivización de los derechos del niño, niña y adolescente;\n2) descentralizar los organismos de aplicación de los planes y programas específicos de las distintas políticas de protección integral de derechos, a fin de garantizar mayor autonomía, agilidad y eficiencia;\n3) diseñar, desarrollar, monitorear, articular y evaluar los planes, programas y proyectos específicos de las distintas áreas de salud, educación, vivienda, recreación, trabajo, deporte, cultura, seguridad pública y social, con criterios de integridad, transversalidad, intersectorialidad e interdisciplinariedad y participación activa de la comunidad;\n4) propiciar la constitución de organizaciones y organismos para la defensa de los derechos del niño, niña y adolescente que brindan asesoramiento y patrocinio jurídico gratuito, deduzcan denuncias o promuevan acciones ante tribunales, asesorías, fiscalías, defensorías, y asociaciones profesionales con las que se convenga la actuación en carácter de defensa técnica;\n5) propender a la formación de redes sociales que contribuyan a la optimización de los recursos existentes.",
36:"Las medidas de protección de derechos tienen como finalidad la preservación o restitución del goce y ejercicio de derechos amenazados o vulnerados y la reparación de sus consecuencias; pueden ser acordadas en forma aislada o conjuntamente; son limitadas en el tiempo y se mantienen mientras persistan las causas que dieron origen a la violación, amenaza o restricción.\nSólo pueden ser acordadas con la participación del niño, niña o adolescente y demás partes interesadas, ante la violación, amenaza o restricción de los derechos del niño, niña y adolescente por acción u omisión del Estado, la comunidad o la familia.\nSe da prioridad a las medidas que tienen por finalidad la preservación de los vínculos familiares y el fortalecimiento de su rol en relación al niño, niña y adolescente.\nEn ningún caso estas medidas pueden consistir en privación de la libertad.\nLas medidas adoptadas pueden ser sustituidas en cualquier momento por otras que garantizan de mejor forma el goce y ejercicio de los derechos.",
37:"Cuando medie inexistencia o privación del grupo familiar de pertenencia, las medidas de protección consisten en la búsqueda e individualización de alternativas para que el niño, niña y adolescente conviva con personas vinculadas a él a través de líneas de parentesco, por consanguinidad o por afinidad, o con otros miembros de la familia ampliada o de la comunidad, según la costumbre local, teniendo en cuenta la opinión y los deseos del niño, niña y adolescente en todos los casos.\nCualesquiera de esas formas alternativas de convivencia, instrumentadas con la intervención de las agencias de protección de derechos, configura una guarda provisoria que debe formalizarse con intervención del juez competente.\nLa guarda formalizada ante el juez competente, debe efectuarse bajo constancia de que los padres o responsables, han sido informados de las responsabilidades que les competen con relación al niño, niña y adolescente, así como las condiciones en que la guarda va a ejercerse.\nNinguna autoridad pública o privada, puede obstaculizar el pleno goce de los derechos de los niños, niñas y adolescentes, bajo pretexto de que la guarda provisoria no ha sido formalizada judicialmente.",
38:"Cuando la violación, amenaza o restricción de derechos se produce como consecuencia de necesidades básicas insatisfechas, carencias o dificultades materiales, económicas, laborales o de vivienda; las medidas de protección a aplicar, consisten en los planes, programas y proyectos sociales establecidos por las políticas públicas, que deben brindar orientación, ayuda y apoyo, incluso económico, con miras a la sustentación y fortalecimiento de los vínculos del grupo familiar responsable del desarrollo integral del niño, niña y adolescente.",
39:"Cuando un niño, niña o adolescente llega por cualquier circunstancia de vulneración de algunos de sus derechos a una institución pública o privada de atención o asistencia a la infancia, sus responsables deben informar en el término máximo de veinticuatro (24) horas o el primer día hábil inmediato posterior a las instancias administrativas provinciales o municipales que integran el sistema de protección integral de derechos de la presente ley, a fin de que articulen inmediatamente las medidas alternativas de convivencia familiar del artículo 37 de la presente.",
40:"Toda persona que tome conocimiento de la existencia de abuso físico, psíquico, sexual, explotación o cualquier trato que impida o menoscabe los derechos de un niño, niña y adolescente, debe informarlo inmediatamente a las instancias administrativas creadas por esta ley en los ámbitos provincial o municipal.",
41:"Investigada y comprobada la violación, amenaza o restricción de derechos, pueden implementarse, sin perjuicio de las demás mencionadas en el presente Capítulo, las siguientes medidas:\n1) guía, consejo y asistencia al niño, niña y adolescente, y la familia;\n2) apoyo para que el niño, niña y adolescente permanezca con su grupo familiar;\n3) asistencia integral a la embarazada, teniendo especialmente en cuenta la situación de quienes pretenden otorgar la guarda de su hijo con fines de adopción;\n4) instancia de conferencia del grupo familiar a los fines de la resolución de conflictos;\n5) apoyo para la inscripción y asistencia a establecimientos educativos, los que deben dar en su formación debida consideración a los deseos y opiniones del niño, niña y adolescente, y sus familias;\n6) promoción de espacios de participación en ámbitos comunitarios;\n7) asistencia para la realización de tratamientos médicos, psiquiátricos o de adicciones, en sistemas de internación o ambulatorios;\n8) permanencia temporal en ámbitos familiares alternativos dentro del Sistema de Acogimiento Familiar Alternativo, como medida excepcional, por el menor tiempo posible e impulsando mecanismos que permitan la más rápida revinculación con la familia de origen, nuclear o extensa, salvo que existan razones fundadas para que la medida se lleve a cabo en ámbitos familiares alternativos de entidades públicas o privadas.\nLas medidas enunciadas en este artículo deben ser acordadas originariamente en las instancias administrativas creadas en los ámbitos provincial o municipal con la debida participación del niño, niña y adolescente, y su familia, o aquellos a los que adhiere afectivamente.\nLas medidas previstas en los incisos 7), cuando no hubo acuerdo y 8) de este artículo, deben ser dispuestas con intervención de la autoridad judicial competente.",
42:"Verificada la situación de maltrato o abuso psíquico o físico por parte de los padres o responsables del niño, niña y adolescente, el juez puede, de acuerdo a la normativa vigente, determinar la exclusión del agresor de la vivienda común."};
const TOP=[['Interés superior','Art. 4','Principio de interpretación y aplicación de la ley, de cumplimiento obligatorio en todas las decisiones concernientes a niños, niñas y adolescentes.',4],['Protección integral de la salud','Art. 12','Medidas que adopta el Estado provincial para garantizar el derecho a la salud desde una perspectiva integral.',12],['Garantías procesales','Art. 31','Principios y garantías reconocidos en todo proceso legal, desde la presunción de inocencia hasta la preservación de la intimidad.',31],['Medidas de protección de derechos','Arts. 36 a 41','Limitadas en el tiempo; preservan o restituyen derechos amenazados o vulnerados y en ningún caso pueden consistir en privación de la libertad.',36],['Consejo Provincial de Garantías','Arts. 44 a 48','Organismo intersectorial de articulación, deliberación, consulta y asesoramiento en políticas públicas de la niñez, la adolescencia y la familia.',44],['Restricción de la libertad','Arts. 93 a 96','Casos de aprehensión sin orden judicial, obligaciones ante la detención y plazo de veinticuatro horas para resolver.',93]];
const nodeOf={};N.forEach((n,i)=>{n[5]=i;for(let a=n[3];a<=n[4];a++)nodeOf[a]=i});
const col=i=>C[N[i][0]],sty=i=>`--ac:${col(i)};--b:color-mix(in srgb,${col(i)} 13%,var(--card))`;
const rng=n=>n[3]==n[4]?'Art. '+n[3]:`Arts. ${n[3]}–${n[4]}`,cnt=n=>n[4]-n[3]+1;
let lib='';
function nav(){let h='<h5>Índice</h5>',k=-1;N.forEach((n,i)=>{if(n[0]!=k){k=n[0];h+=`<h5 style="margin-top:14px">${L[k]} · ${LN[k]}</h5>`}h+=`<details><summary style="border-left:4px solid ${col(i)}">${n[1]} · ${esc(n[2])}</summary><a class="l" data-n="${i}" href="#/n/${i}"><b>Ver sección completa</b></a>`;for(let a=n[3];a<=n[4];a++)h+=`<a class="l" data-a="${a}" href="#/a/${a}">Art. ${a} · ${esc(T[a-1])}</a>`;h+='</details>'});side.innerHTML=h}
function markSide(sel){side.querySelectorAll('.l.on').forEach(x=>x.classList.remove('on'));if(!sel)return;const l=side.querySelector(sel);if(l){l.classList.add('on');l.parentElement.open=true}}
function setLib(v){lib=v;document.querySelectorAll('#fc .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.l===v))}
const foot=()=>`<p class="foot">Los títulos de los artículos y la estructura en libros, títulos y capítulos siguen el texto de la Ley II – N.º 16 (antes Ley 3820), Ley de Protección Integral de los Derechos de Niños, Niñas y Adolescentes de la provincia de Misiones; los artículos 135 y 136 no llevan título en el documento. Esta versión reproduce el texto completo de los artículos 1 a 42. Según el artículo 135, la vigencia de los Libros II y III está suspendida hasta tanto se dicte su reglamentación. Verifique siempre con la versión oficial vigente.</p>`;
function artHTML(n){const t=X[n];return `<article class="art" id="a${n}"><header><div class="num">Art. ${n}</div><div><h4>${esc(T[n-1])}</h4>${t?'':'<p class="nt">Texto completo no incluido en esta versión.</p>'}</div></header>${t?`<div class="acts"><button class="btn sm" data-t="${n}">Ver texto completo</button></div><div class="full" hidden>${t.split('\n').map(p=>`<p class="${/^\d+\)/.test(p)?'inc':''}">${esc(p)}</p>`).join('')}</div>`:''}</article>`}
function card(n){const s=[];for(let a=n[3];a<=Math.min(n[4],n[3]+2);a++)s.push(T[a-1]);return `<a class="card" href="#/n/${n[5]}" style="${sty(n[5])}"><h3><span class="big">${n[1]}</span>${esc(n[2])}</h3><p>${esc(s.join(' · ')+(cnt(n)>3?' · …':''))}</p><div class="meta"><span>${rng(n)}</span><span>${cnt(n)} art.</span></div></a>`}
const grid=k=>`<div class="grid">${N.filter(n=>n[0]==k).map(card).join('')}</div>`;
function home(){main.style.cssText='';
main.innerHTML=`<section class="hero"><span class="eyebrow">Ley II – N.º 16 · Antes Ley 3820</span><h1>Protección Integral de los Derechos de Niños, Niñas y Adolescentes</h1><p>Ley de la provincia de Misiones. Índice navegable de sus 136 artículos, organizados en tres libros, con búsqueda por título y por texto, y el texto completo de los artículos 1 a 42.</p>
<div class="stats"><div class="stat"><b>136</b><span>artículos</span></div><div class="stat"><b>3</b><span>libros</span></div><div class="stat"><b>${N.length}</b><span>secciones</span></div></div>
<div class="go"><input id="gn" type="number" min="1" max="136" placeholder="Ir al artículo N.º"><button class="btn" id="gb">Ir</button></div></section>`+[0,1,2].map(k=>`<div class="sec"><h2>${L[k]}</h2><span>${LN[k]}</span></div>${grid(k)}`).join('')+`<div class="sec"><h2>Accesos rápidos por tema</h2><span>${TOP.length} temas</span></div><div class="grid">${TOP.map(t=>`<a class="card" href="#/a/${t[3]}" style="${sty(nodeOf[t[3]])}"><h3><span class="big">${t[1]}</span>${esc(t[0])}</h3><p>${esc(t[2])}</p></a>`).join('')}</div>`+foot();
const go=()=>{const v=+$('#gn').value;if(v>=1&&v<=136)location.hash='/a/'+v;else alert('Ingrese un número entre 1 y 136')};$('#gb').onclick=go;$('#gn').onkeydown=e=>e.key=='Enter'&&go()}
function libView(k){main.style.cssText=`--ac:${C[k]};--b:color-mix(in srgb,${C[k]} 13%,var(--card))`;main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>${L[k]}</span></nav><header class="nh"><span class="eyebrow">${L[k]}</span><h1>${esc(LN[k])}</h1><div class="meta"><span>${N.filter(n=>n[0]==k).length} secciones</span></div></header>${grid(k)}`+foot();markSide(null)}
function nodeView(i){const n=N[i];let h=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><a href="#/l/${n[0]}">${L[n[0]]}</a><span>›</span><span>${n[1]}</span></nav><header class="nh"><span class="eyebrow">${L[n[0]]} · ${n[1]}</span><h1>${esc(n[2])}</h1><div class="meta"><span>${rng(n)}</span><span>${cnt(n)} artículo${cnt(n)>1?'s':''}</span></div></header>`;
let li='',s='';for(let a=n[3];a<=n[4];a++){li+=`<li><a href="#/a/${a}"><b>Art. ${a}</b> – ${esc(T[a-1])}</a></li>`;s+=artHTML(a)}
h+=`<div class="box"><h4>Resumen de la sección</h4><p>Comprende ${cnt(n)>1?`los artículos <b>${n[3]}</b> a <b>${n[4]}</b> (${cnt(n)} en total), que regulan:`:`el artículo <b>${n[3]}</b>, que regula:`}</p><ul>${li}</ul></div><div class="bar"><button class="btn sm" data-all="1">Expandir todos los textos</button><button class="btn sm ghost" data-all="0">Contraer todos</button></div>${s}`;
h+=`<div class="pn">${i>0?`<a class="btn ghost" href="#/n/${i-1}">← ${esc(N[i-1][2])}</a>`:'<span></span>'}${i<N.length-1?`<a class="btn ghost" href="#/n/${i+1}">${esc(N[i+1][2])} →</a>`:''}</div>`;
main.innerHTML=h+foot();main.style.cssText=sty(i);markSide(`.l[data-n="${i}"]`)}
function search(v){const ts=norm(v).split(/\s+/).filter(Boolean);if(!ts.length)return route();if(/^\d+$/.test(v.trim())&&+v>=1&&+v<=136){location.hash='/a/'+(+v);return}
main.style.cssText='';markSide(null);const rs=[];for(let a=1;a<=136;a++){if(lib!==''&&N[nodeOf[a]][0]!=+lib)continue;const k=norm(T[a-1]+' '+(X[a]||''));if(ts.every(w=>k.includes(w)))rs.push(a)}
const hl=t=>{let o=esc(t);ts.forEach(w=>{o=o.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')});return o};
main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Búsqueda</span></nav><div class="sec"><h2>Resultados para «${esc(v)}»</h2><span>${rs.length} artículo${rs.length==1?'':'s'}</span></div><p class="hint">Busca en los títulos de los 136 artículos y en el texto completo de los artículos 1 a 42.</p><div class="res">${rs.map(a=>{const n=N[nodeOf[a]];return `<article class="art"><header><div class="num">Art. ${a}</div><div><h4>${hl(T[a-1])}<small>${L[n[0]]} · ${n[1]} · ${esc(n[2])}</small></h4></div></header><div class="acts"><a class="btn sm" href="#/a/${a}">Abrir artículo en su sección</a></div></article>`}).join('')||'<p>Sin coincidencias. Probá con otra palabra o quitá el filtro de Libro.</p>'}</div>`}
function route(){const h=location.hash.slice(1)||'/',m=h.match(/^\/(n|a|l)\/(\d+)/);side.classList.remove('open');window.scrollTo(0,0);
if(!m){setLib('');home();markSide(null);return}
const x=+m[2];if(m[1]=='l'&&x<3){setLib(String(x));libView(x)}
else if(m[1]=='n'&&N[x]){setLib(String(N[x][0]));nodeView(x)}
else if(m[1]=='a'&&nodeOf[x]!=null){setLib(String(N[nodeOf[x]][0]));nodeView(nodeOf[x]);markSide(`.l[data-a="${x}"]`);const e=document.getElementById('a'+x);if(e){e.classList.add('hit');const f=e.querySelector('.full'),b=e.querySelector('[data-t]');if(f){f.hidden=false;b.textContent='Ocultar texto completo'}setTimeout(()=>e.scrollIntoView({block:'start'}),30)}}
else{setLib('');home()}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.t){const f=b.closest('.art').querySelector('.full');f.hidden=!f.hidden;b.textContent=f.hidden?'Ver texto completo':'Ocultar texto completo'}
else if(b.dataset.all){document.querySelectorAll('.art').forEach(a=>{const f=a.querySelector('.full'),t=a.querySelector('[data-t]');if(f){f.hidden=b.dataset.all=='0';t.textContent=f.hidden?'Ver texto completo':'Ocultar texto completo'}})}});
$('#home').onclick=()=>{$('#q').value='';location.hash='/';route()};
let tm;$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>search(e.target.value),180)};
$('#menu').onclick=()=>side.classList.toggle('open');
addEventListener('hashchange',()=>{$('#q').value='';route()});
$('#fc').innerHTML='<button class="chip" data-l="" aria-pressed="true">Todos</button>'+L.map((l,k)=>`<button class="chip" data-l="${k}" aria-pressed="false" title="${esc(LN[k])}">${l}</button>`).join('');
$('#fc').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;setLib(b.dataset.l);const v=$('#q').value;if(v.trim())search(v);else location.hash=b.dataset.l===''?'/':'/l/'+b.dataset.l;};
const th=()=>document.documentElement.style.setProperty('--th',$('.top').offsetHeight+'px');addEventListener('resize',th);document.fonts&&document.fonts.ready.then(th);th();
nav();route();th();
</script>
</body>
</html>
