<style>

<script>
const $=s=>document.querySelector(s),main=$('#main'),side=$('#side');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const L=['Título I','Título II','Título III'],LN=['Normas generales','Normas especiales','Disposiciones complementarias'];
const C=['#6f63d9','#3f8ad0','#2f9a79'];
const N=[[0,'Capítulo I','Objetivo, concepto y calificación de la discapacidad',1,3],[0,'Capítulo II','Servicios de asistencia, prevención, órgano rector',4,5],[1,'Capítulo I','Salud y asistencia social',6,7],[1,'Capítulo II','Trabajo y educación',8,13],[1,'Capítulo III','Seguridad social',14,19],[1,'Capítulo IV','Transporte y arquitectura diferenciada',20,22],[2,'Título III','Disposiciones complementarias',23,29]];
const T='Sistema de protección integral|Concepto de persona discapacitada|Certificado de discapacidad|Servicios que presta el Estado|Funciones del Ministerio de Bienestar Social|Servicios hospitalarios y talleres protegidos terapéuticos|Hogares con internación|Cupo laboral del 4 %|Autorización y fiscalización de tareas|Derechos y obligaciones laborales|Prioridad en concesiones de pequeños comercios|Talleres protegidos de producción|Funciones del Ministerio de Cultura y Educación|Normas de seguridad social aplicables|Prestaciones médico-asistenciales (ley 22.269)|Asignaciones por escolaridad (ley 18.017)|Modificaciones a la ley 18.037|Modificación a la ley 18.038|Acreditación en jubilaciones y pensiones|Transporte gratuito|Distintivo de identificación y franquicias|Accesibilidad en obras públicas|Deducción en el Impuesto a las Ganancias|Presupuesto|Modificaciones a la ley 20.475|Derogaciones|Adhesión de las provincias|Reglamentación|Disposición de forma'.split('|');
const X={
1:"Institúyese por la presente ley, un sistema de protección integral de las personas discapacitadas, tendiente a asegurar a éstas su atención médica, su educación y su seguridad social, así como a concederles las franquicias y estímulos que permitan en lo posible neutralizar la desventaja que la discapacidad les provoca y les den oportunidad, mediante su esfuerzo, de desempeñar en la comunidad un rol equivalente al que ejercen las personas normales.",
2:"A los efectos de esta ley, se considera discapacitada a toda persona que padezca una alteración funcional permanente o prolongada, física o mental, que en relación a su edad y medio social implique desventajas considerables para su integración familiar, social, educacional o laboral.",
3:"La Secretaría de Estado de Salud Pública certificará en cada caso la existencia de la discapacidad, su naturaleza y su grado, así como las posibilidades de rehabilitación del afectado. Dicha Secretaría de Estado indicará también, teniendo en cuenta la personalidad y los antecedentes del afectado, qué tipo de actividad laboral o profesional puede desempeñar.\nEl certificado que se expida acreditará plenamente la discapacidad en todos los supuestos en que sea necesario invocarla, salvo lo dispuesto en el artículo 19 de la presente ley.",
4:"El Estado, a través de sus organismos dependientes, prestará a los discapacitados, en la medida en que éstos, las personas de quienes dependan, o los entes de obra social a los que estén afiliados, no puedan afrontarlos, los siguientes servicios:\na) Rehabilitación integral, entendida como el desarrollo de las capacidades de la persona discapacitada;\nb) Formación laboral o profesional;\nc) Préstamos y subsidios destinados a facilitar su actividad laboral o intelectual;\nd) Regímenes diferenciales de seguridad social;\ne) Escolarización en establecimientos comunes con los apoyos necesarios provistos gratuitamente, o en establecimientos especiales cuando en razón del grado de discapacidad no puedan cursar la escuela común;\nf) Orientación o promoción individual, familiar y social.",
5:"Asígnanse al Ministerio de Bienestar Social de la Nación las siguientes funciones:\na) Actuar de oficio para lograr el pleno cumplimiento de las medidas establecidas en la presente ley;\nb) Reunir toda la información sobre problemas y situaciones que plantea la discapacidad;\nc) Desarrollar planes estatales en la materia y dirigir la investigación en el área de la discapacidad;\nd) Prestar asistencia técnica y financiera a las provincias;\ne) Realizar estadísticas que no lleven a cabo otros organismos estatales;\nf) Apoyar y coordinar la actividad de las entidades privadas sin fines de lucro que orienten sus acciones en favor de las personas discapacitadas;\ng) Proponer medidas adicionales a las establecidas en la presente ley, que tiendan a mejorar la situación de las personas discapacitadas y a prevenir las discapacidades y sus consecuencias;\nh) Estimular a través de los medios de comunicación el uso efectivo de los recursos y servicios existentes, así como propender al desarrollo del sentido de solidaridad social en esta materia.",
6:"El Ministerio de Bienestar Social de la Nación y la Municipalidad de la Ciudad de Buenos Aires pondrán en ejecución programas a través de los cuales se habiliten, en los hospitales de sus jurisdicciones, de acuerdo a su grado de complejidad y al ámbito territorial a cubrir, servicios especiales destinados a las personas discapacitadas.\nPromoverán también la creación de talleres protegidos terapéuticos y tendrán a su cargo su habilitación, registro y supervisión.",
7:"El Ministerio de Bienestar Social de la Nación apoyará la creación de hogares con internación total o parcial para personas discapacitadas cuya atención sea dificultosa a través del grupo familiar, reservándose en todos los casos la facultad de reglamentar y fiscalizar su funcionamiento. Serán tenidas especialmente en cuenta, para prestar ese apoyo, las actividades de las entidades privadas sin fines de lucro.",
8:"El Estado Nacional, sus organismos descentralizados o autárquicos, los entes públicos no estatales, las empresas del Estado y la Municipalidad de la Ciudad de Buenos Aires, están obligados a ocupar personas discapacitadas que reúnan condiciones de idoneidad para el cargo, en una proporción no inferior al cuatro por ciento (4 %) de la totalidad de su personal.",
9:"El desempeño de determinada tarea por parte de personas discapacitadas deberá ser autorizado y fiscalizado por el Ministerio de Trabajo teniendo en cuenta la indicación efectuada por la Secretaría de Estado de Salud Pública, dispuesto en el artículo 3°. Dicho Ministerio fiscalizará además lo dispuesto en el artículo 8°.",
10:"Las personas discapacitadas que se desempeñen en los entes indicados en el artículo 8°, gozarán de los mismos derechos y estarán sujetas a las mismas obligaciones que la legislación laboral aplicable prevé para el trabajador normal.",
11:"En todos los casos en que se conceda u otorgue el uso de bienes del dominio público o privado del Estado Nacional o de la Municipalidad de la Ciudad de Buenos Aires para la explotación de pequeños comercios, se dará prioridad a las personas discapacitadas que estén en condiciones de desempeñarse en tales actividades, siempre que las atiendan personalmente, aún cuando para ello necesiten del ocasional auxilio de terceros. Idéntico criterio adoptarán las empresas del Estado Nacional y de la Municipalidad de la Ciudad de Buenos Aires con relación a los inmuebles que les pertenezcan o utilicen.\nSerá nulo de nulidad absoluta la concesión o permiso otorgado sin observar la prioridad establecida en el presente artículo. El Ministerio de Trabajo, de oficio o a petición de parte, requerirá la revocación por ilegitimidad de tal concesión o permiso. Revocado por las razones antedichas la concesión o permiso, el organismo público otorgará éstos en forma prioritaria y en las mismas condiciones, a persona o personas discapacitadas.",
12:"El Ministerio de Trabajo apoyará la creación de talleres protegidos de producción y tendrá a su cargo su habilitación, registro y supervisión. Apoyará también la labor de las personas discapacitadas a través del régimen de trabajo a domicilio.\nEl citado Ministerio propondrá al Poder Ejecutivo nacional el régimen laboral al que habrá de subordinarse la labor en los talleres protegidos de producción.",
13:"El Ministerio de Cultura y Educación tendrá a su cargo:\na) Orientar las derivaciones y controlar los tratamientos de los educandos discapacitados, en todos los grados educacionales especiales, oficiales o privados, en cuanto dichas acciones se vinculen con la escolarización de los discapacitados tendiendo a su integración al sistema educativo.\nb) Dictar las normas de ingreso y egreso a establecimientos educacionales para personas discapacitadas, las cuales se extenderán desde la detección de los déficits hasta los casos de discapacidad profunda, aún cuando ésta no encuadre en el régimen de las escuelas de educación especial.\nc) Crear centros de valuación y orientación vocacional para los educandos discapacitados.\nd) Coordinar con las autoridades competentes las derivaciones de los educandos discapacitados a tareas competitivas o a talleres protegidos.\ne) Formar personal docente y profesionales especializados para todos los grados educacionales de los discapacitados, promoviendo los recursos humanos necesarios para la ejecución de los programas de asistencia, docencia e investigación en materia de rehabilitación.",
14:"En materia de seguridad social se aplicarán a las personas discapacitadas las normas generales o especiales previstas en los respectivos regímenes y en las leyes 20.475 y 20.888.",
15:"Intercálase en el artículo 9° de la ley 22.269, como tercer párrafo, el siguiente:\n“Inclúyense dentro del concepto de prestaciones médico-asistenciales básicas, las que requiera la rehabilitación de las personas discapacitadas con el alcance que la reglamentación establezca”.",
16:"Agrégase a la ley 18.017 (t.o. 1974), como artículo 14 bis, el siguiente:\n“Artículo 14 bis. - El monto de las asignaciones por escolaridad primaria, media y superior, y de ayuda escolar, se duplicará cuando el hijo a cargo del trabajador, de cualquier edad, fuere discapacitado y concurriese a establecimiento oficial, o privado controlado por autoridad competente, donde se imparta educación común o especial.\nA los efectos de esta ley, la concurrencia regular del hijo discapacitado a cargo del trabajador, a establecimiento oficial, o privado controlado por autoridad competente, en el que se presten servicios de rehabilitación exclusivamente, será considerada como concurrencia regular a establecimiento en que se imparta enseñanza primaria”.",
17:"Modifícase la ley 18.037 (t.o. 1976), en la forma que a continuación se indica:\n1) Agrégase al artículo 15, como último párrafo, el siguiente:\n“La autoridad de aplicación, previa consulta a los órganos competentes, establecerá el tiempo mínimo de trabajo efectivo anual que debe realizar el afiliado discapacitado para computar un (1) año”.\n2) Intercálase en el artículo 65, como segundo párrafo, el siguiente:\n“Percibirá la jubilación por invalidez hasta el importe de la compatibilidad que el Poder Ejecutivo fije de acuerdo con el inciso b) del artículo anterior, el beneficiario que reingresare a la actividad en relación de dependencia por haberse rehabilitado profesionalmente. Esta última circunstancia deberá acreditarse mediante certificado expedido por el órgano competente para ello”.",
18:"Intercálase en el artículo 47 de la ley 18.038 (t.o. 1980), como segundo párrafo, el siguiente:\n“Percibirá la jubilación por invalidez hasta el importe de la compatibilidad que el Poder Ejecutivo fije de acuerdo con el inciso e) del artículo anterior, el beneficiario que reingresare a la actividad en relación de dependencia por haberse rehabilitado profesionalmente. Esta última circunstancia deberá acreditarse mediante certificado expedido por el órgano competente para ello”.",
19:"En materia de jubilaciones y pensiones, la discapacidad se acreditará con arreglo a lo dispuesto en los artículos 33 y 35 de la ley 18.037 (t.o. 1976) y 23 de la ley 18.038 (t.o. 1980).",
20:"Las empresas de transporte colectivo terrestre sometidas al contralor de autoridad nacional deberán transportar gratuitamente a las personas discapacitadas en el trayecto que medie entre el domicilio del discapacitado y el establecimiento educacional y/o de rehabilitación a los que deban concurrir.\nLa reglamentación establecerá las comodidades que deben otorgarse a los discapacitados transportados, las características de los pases que deberán exhibir y las sanciones aplicables a los transportistas en caso de inobservancia de esta norma.",
21:"El distintivo de identificación a que se refiere el artículo 12 de la ley 19.279 acreditará el derecho a franquicias de libre tránsito y estacionamiento de acuerdo con lo que establezcan las respectivas disposiciones municipales, las que no podrán excluir de esas franquicias a los automóviles patentados en otras jurisdicciones.",
22:"En toda obra pública que se destine a actividades que supongan el acceso de público, que se ejecute en lo sucesivo, deberán preverse accesos, medios de circulación e instalaciones adecuadas para personas discapacitadas que utilicen sillas de ruedas. La misma previsión deberá efectuarse en los edificios destinados a empresas privadas de servicios públicos y en los que se exhiban espectáculos públicos que en adelante se construyan o reformen.\nLa reglamentación establecerá el alcance de la obligación impuesta en este artículo, atendiendo a las características y destino de las construcciones aludidas.\nLas autoridades a cargo de las obras públicas existentes prevén su adecuación para dichos fines.",
23:"Los empleadores que concedan empleo a personas discapacitadas tendrán derecho al cómputo de una deducción especial en el Impuesto a las Ganancias, equivalente al setenta por ciento (70 %) de las retribuciones correspondientes al personal discapacitado en cada período fiscal.\nEl cómputo del porcentaje antes mencionado deberá hacerse al cierre de cada período.\nSe tendrán en cuenta las personas discapacitadas que realicen trabajo a domicilio.",
24:"La Ley de Presupuesto determinará anualmente el monto que se destinará para dar cumplimiento a lo previsto en el artículo 4°, inciso c) de la presente ley. La reglamentación determinará en qué jurisdicción presupuestaria se realizará la erogación.",
25:"Sustitúyese en el texto de la ley 20.475 la expresión \"minusválidos\" por \"discapacitados\".\nAclárase la citada ley 20.475, en el sentido de que a partir de la vigencia de la ley 21.451 no es aplicable el artículo 5° de aquélla, sino lo establecido en el artículo 49, punto 2 de la ley 18.037 (t.o. 1976).",
26:"Deróganse las leyes 13.926, 20.881 y 20.923.",
27:"El Poder Ejecutivo nacional propondrá a las provincias la sanción en sus jurisdicciones de regímenes normativos que establezcan principios análogos a los de la presente ley.\nEn el acto de adhesión a esta ley, cada provincia establecerá los organismos que tendrán a su cargo en el ámbito provincial, las actividades previstas en los artículos 6°, 7° y 13 que anteceden. Determinarán también con relación a los organismos públicos y empresas provinciales, así como respecto a los bienes del dominio público o privado del estado provincial y de sus municipios, el alcance de las normas contenidas en los artículos 8° y 11 de la presente ley.",
28:"El Poder Ejecutivo Nacional reglamentará las disposiciones de la presente ley dentro de los ciento ochenta (180) días de su promulgación.",
29:"Comuníquese, publíquese, dese a la Dirección Nacional del Registro Oficial y archívese."};
const TOP=[['Concepto de discapacidad','Art. 2','Alteración funcional permanente o prolongada, física o mental, que implica desventajas considerables para la integración familiar, social, educacional o laboral.',2],['Cupo laboral del 4 %','Art. 8','El Estado nacional y sus entes deben ocupar personas discapacitadas en una proporción no inferior al cuatro por ciento de su personal.',8],['Transporte gratuito','Art. 20','Traslado sin cargo entre el domicilio y el establecimiento educacional o de rehabilitación.',20],['Accesibilidad en obras públicas','Art. 22','Accesos, medios de circulación e instalaciones adecuadas para personas que utilicen sillas de ruedas.',22]];
const nodeOf={};N.forEach((n,i)=>{n[5]=i;for(let a=n[3];a<=n[4];a++)nodeOf[a]=i});
const col=i=>C[N[i][0]],sty=i=>`--ac:${col(i)};--b:color-mix(in srgb,${col(i)} 13%,var(--card))`;
const rng=n=>n[3]==n[4]?'Art. '+n[3]:`Arts. ${n[3]}–${n[4]}`,cnt=n=>n[4]-n[3]+1;
let lib='';
function nav(){let h='<h5>Índice</h5>',k=-1;N.forEach((n,i)=>{if(n[0]!=k){k=n[0];h+=`<h5 style="margin-top:14px">${L[k]} · ${LN[k]}</h5>`}h+=`<details><summary style="border-left:4px solid ${col(i)}">${n[1]} · ${esc(n[2])}</summary><a class="l" data-n="${i}" href="#/n/${i}"><b>Ver sección completa</b></a>`;for(let a=n[3];a<=n[4];a++)h+=`<a class="l" data-a="${a}" href="#/a/${a}">Art. ${a} · ${esc(T[a-1])}</a>`;h+='</details>'});side.innerHTML=h}
function markSide(sel){side.querySelectorAll('.l.on').forEach(x=>x.classList.remove('on'));if(!sel)return;const l=side.querySelector(sel);if(l){l.classList.add('on');l.parentElement.open=true}}
function setLib(v){lib=v;document.querySelectorAll('#fc .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.l===v))}
const foot=()=>`<p class="foot">Los títulos de los artículos son una guía de lectura redactada a partir del texto del documento; el PDF no incluye títulos. La estructura en títulos y capítulos y el texto completo reproducen la Ley XIX – N.º 23 (antes Ley 2707), Anexo I (Ley Nacional N.º 22.431), según el documento cargado. Verifique siempre con la versión oficial vigente.</p>`;
function artHTML(n){const t=X[n];return `<article class="art" id="a${n}"><header><div class="num">Art. ${n}</div><div><h4>${esc(T[n-1])}</h4>${t?'':'<p class="nt">Texto completo no incluido en esta versión.</p>'}</div></header>${t?`<div class="acts"><button class="btn sm" data-t="${n}">Ver texto completo</button></div><div class="full" hidden>${t.split('\n').map(p=>`<p class="${/^([a-z]|\d+)\)/.test(p)?'inc':''}">${esc(p)}</p>`).join('')}</div>`:''}</article>`}
function card(n){const s=[];for(let a=n[3];a<=Math.min(n[4],n[3]+2);a++)s.push(T[a-1]);return `<a class="card" href="#/n/${n[5]}" style="${sty(n[5])}"><h3><span class="big">${n[1]}</span>${esc(n[2])}</h3><p>${esc(s.join(' · ')+(cnt(n)>3?' · …':''))}</p><div class="meta"><span>${rng(n)}</span><span>${cnt(n)} art.</span></div></a>`}
const grid=k=>`<div class="grid">${N.filter(n=>n[0]==k).map(card).join('')}</div>`;
function home(){main.style.cssText='';
main.innerHTML=`<section class="hero"><span class="eyebrow">Ley XIX – N.º 23 · Antes Ley 2707 · Anexo I</span><h1>Sistema de protección integral de las personas discapacitadas</h1><p>Texto completo de los 29 artículos del Anexo I, con índice navegable por títulos y capítulos y búsqueda por título y por texto.</p>
<div class="stats"><div class="stat"><b>29</b><span>artículos</span></div><div class="stat"><b>3</b><span>títulos</span></div><div class="stat"><b>${N.length}</b><span>secciones</span></div></div>
<div class="go"><input id="gn" type="number" min="1" max="29" placeholder="Ir al artículo N.º"><button class="btn" id="gb">Ir</button></div></section>`+[0,1,2].map(k=>`<div class="sec"><h2>${L[k]}</h2><span>${LN[k]}</span></div>${grid(k)}`).join('')+`<div class="sec"><h2>Accesos rápidos por tema</h2><span>${TOP.length} temas</span></div><div class="grid">${TOP.map(t=>`<a class="card" href="#/a/${t[3]}" style="${sty(nodeOf[t[3]])}"><h3><span class="big">${t[1]}</span>${esc(t[0])}</h3><p>${esc(t[2])}</p></a>`).join('')}</div>`+foot();
const go=()=>{const v=+$('#gn').value;if(v>=1&&v<=29)location.hash='/a/'+v;else alert('Ingrese un número entre 1 y 29')};$('#gb').onclick=go;$('#gn').onkeydown=e=>e.key=='Enter'&&go()}
function libView(k){main.style.cssText=`--ac:${C[k]};--b:color-mix(in srgb,${C[k]} 13%,var(--card))`;main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>${L[k]}</span></nav><header class="nh"><span class="eyebrow">${L[k]}</span><h1>${esc(LN[k])}</h1><div class="meta"><span>${N.filter(n=>n[0]==k).length} secciones</span></div></header>${grid(k)}`+foot();markSide(null)}
function nodeView(i){const n=N[i];let h=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><a href="#/l/${n[0]}">${L[n[0]]}</a><span>›</span><span>${n[1]}</span></nav><header class="nh"><span class="eyebrow">${L[n[0]]} · ${n[1]}</span><h1>${esc(n[2])}</h1><div class="meta"><span>${rng(n)}</span><span>${cnt(n)} artículo${cnt(n)>1?'s':''}</span></div></header>`;
let li='',s='';for(let a=n[3];a<=n[4];a++){li+=`<li><a href="#/a/${a}"><b>Art. ${a}</b> – ${esc(T[a-1])}</a></li>`;s+=artHTML(a)}
h+=`<div class="box"><h4>Resumen de la sección</h4><p>Comprende ${cnt(n)>1?`los artículos <b>${n[3]}</b> a <b>${n[4]}</b> (${cnt(n)} en total), que regulan:`:`el artículo <b>${n[3]}</b>, que regula:`}</p><ul>${li}</ul></div><div class="bar"><button class="btn sm" data-all="1">Expandir todos los textos</button><button class="btn sm ghost" data-all="0">Contraer todos</button></div>${s}`;
h+=`<div class="pn">${i>0?`<a class="btn ghost" href="#/n/${i-1}">← ${esc(N[i-1][2])}</a>`:'<span></span>'}${i<N.length-1?`<a class="btn ghost" href="#/n/${i+1}">${esc(N[i+1][2])} →</a>`:''}</div>`;
main.innerHTML=h+foot();main.style.cssText=sty(i);markSide(`.l[data-n="${i}"]`)}
function search(v){const ts=norm(v).split(/\s+/).filter(Boolean);if(!ts.length)return route();if(/^\d+$/.test(v.trim())&&+v>=1&&+v<=29){location.hash='/a/'+(+v);return}
main.style.cssText='';markSide(null);const rs=[];for(let a=1;a<=29;a++){if(lib!==''&&N[nodeOf[a]][0]!=+lib)continue;const k=norm(T[a-1]+' '+(X[a]||''));if(ts.every(w=>k.includes(w)))rs.push(a)}
const hl=t=>{let o=esc(t);ts.forEach(w=>{o=o.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')});return o};
main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Búsqueda</span></nav><div class="sec"><h2>Resultados para «${esc(v)}»</h2><span>${rs.length} artículo${rs.length==1?'':'s'}</span></div><p class="hint">Busca en los títulos y en el texto completo de los 29 artículos.</p><div class="res">${rs.map(a=>{const n=N[nodeOf[a]];return `<article class="art"><header><div class="num">Art. ${a}</div><div><h4>${hl(T[a-1])}<small>${L[n[0]]} · ${n[1]} · ${esc(n[2])}</small></h4></div></header><div class="acts"><a class="btn sm" href="#/a/${a}">Abrir artículo en su sección</a></div></article>`}).join('')||'<p>Sin coincidencias. Probá con otra palabra o quitá el filtro de Título.</p>'}</div>`}
function route(){const h=location.hash.slice(1)||'/',m=h.match(/^\/(n|a|l)\/(\d+)/);side.classList.remove('open');window.scrollTo(0,0);
if(!m){setLib('');home();markSide(null);return}
const x=+m[2];if(m[1]=='l'&&x<3){setLib(String(x));libView(x)}
else if(m[1]=='n'&&N[x]){setLib(String(N[x][0]));nodeView(x)}
else if(m[1]=='a'&&nodeOf[x]!=null){setLib(String(N[nodeOf[x]][0]));nodeView(nodeOf[x]);markSide(`.l[data-a="${x}"]`);const e=document.getElementById('a'+x);if(e){e.classList.add('hit');const f=e.querySelector('.full'),b=e.querySelector('[data-t]');if(f){f.hidden=false;b.textContent='Ocultar texto completo'}setTimeout(()=>e.scrollIntoView({block:'start'}),30)}}
else{setLib('');home()}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.t){const f=b.closest('.art').querySelector('.full');f.hidden=!f.hidden;b.textContent=f.hidden?'Ver texto completo':'Ocultar texto completo'}
else if(b.dataset.all){document.querySelectorAll('.art').forEach(a=>{const f=a.querySelector('.full'),t=a.querySelector('[data-t]');if(f){f.hidden=b.dataset.all=='0';t.textContent=f.hidden?'Ver texto completo':'Ocultar texto completo'}})}});
$('#home').onclick=()=>{$('#q').value='';location.hash='/';route()};
let tm;$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>search(e.target.value),180)};
$('#menu').onclick=()=>side.classList.toggle('open');
addEventListener('hashchange',()=>{$('#q').value='';route()});
$('#fc').innerHTML='<button class="chip" data-l="" aria-pressed="true">Todos</button>'+L.map((l,k)=>`<button class="chip" data-l="${k}" aria-pressed="false" title="${esc(LN[k])}">${l}</button>`).join('');
$('#fc').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;setLib(b.dataset.l);const v=$('#q').value;if(v.trim())search(v);else location.hash=b.dataset.l===''?'/':'/l/'+b.dataset.l;};
const th=()=>document.documentElement.style.setProperty('--th',$('.top').offsetHeight+'px');addEventListener('resize',th);document.fonts&&document.fonts.ready.then(th);th();
nav();route();th();
</script>
</body>
</html>
